<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEELBALI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Yatra+One&display=swap">
<style>
/* A 16:9 video frame, full bleed, letterboxed on a dark house. No theatre stage.
   Look: medieval Indian miniature (red ground, yellow dotted border, flat blue and ochre figures)
   with a ghat-painting architecture (violet-blue stone, saffron flags). Press space, click or tap. */
:root{
  color-scheme: dark;
  --house:#120a0c; --ink:#1b1210; --madder:#B4251D; --turmeric:#F2B91E; --cream:#F3E7C9;
  --lapis:#2F4B8F; --leaf:#1F3D26; --saffron:#E8662A;
  --display:"Rozha One",Georgia,serif; --title:"Yatra One","Rozha One",Georgia,serif;
}
html,body{height:100%;margin:0;overscroll-behavior:none;touch-action:manipulation}
body{height:100dvh;background:var(--house);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);box-sizing:border-box;color:var(--cream);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
#frame{position:relative;width:min(calc(100vw - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)),calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 16 / 9));aspect-ratio:16/9;background:#000}
#stage{display:block;width:100%;height:100%}
#cap{position:absolute;left:50%;bottom:6.5%;transform:translateX(-50%);max-width:70%;min-width:16%;text-align:center;
  background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:0 0 0 4px var(--turmeric),0 0 0 6px var(--ink);
  padding:.45em 1.1em;border-radius:6px;font-family:var(--display);font-size:clamp(14px,2.3vw,34px);line-height:1.2;text-wrap:balance}
#cap.blank{display:none}
#cap b{font-size:1.45em;color:var(--madder);letter-spacing:.04em}
#panel{position:absolute;left:50%;top:7%;transform:translateX(-50%);max-width:64%;text-align:center;background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:0 0 0 4px var(--madder),0 0 0 6px var(--ink);padding:.4em 1.2em;font-family:var(--display);font-size:clamp(14px,2.1vw,32px);line-height:1.2;font-style:italic;animation:fadein .5s steps(5) both}
#panel.blank{display:none}
#panel.act{top:5.5%;font-style:normal;font-size:clamp(18px,3.2vw,48px);padding:.3em 1.6em .4em;border-radius:6px;box-shadow:0 0 0 4px var(--turmeric),0 0 0 6px var(--ink)}
#panel.act.day{font-size:clamp(14px,2.1vw,32px);padding:.25em 1.2em .35em}
#panel .actno{display:block;font:700 .34em/1 system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--madder);margin-bottom:.35em}
#panel small{display:block;font-size:.42em;font-style:italic;margin-top:.3em;opacity:.85}
#cap.narr{font-style:italic;background:#EADBB0;max-width:76%}
#tally{position:absolute;right:3.4%;top:5.2%;z-index:3;min-width:6.5em;text-align:center;background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:0 0 0 3px var(--turmeric),0 0 0 5px var(--ink);padding:.25em .8em .3em;border-radius:6px;font-family:var(--display)}
#tally.blank{display:none}
#tally .tl{display:block;font:700 clamp(8px,.95vw,13px)/1 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--madder);margin-bottom:.2em}
#tally .tv{display:block;font-size:clamp(18px,2.6vw,40px);line-height:1.05}
#tally.pop .tv{animation:tpop .3s steps(3)}
@keyframes tpop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
#panel.act{top:5.5%;font-style:normal;font-size:clamp(18px,3.2vw,48px);padding:.3em 1.6em .4em;border-radius:6px;box-shadow:0 0 0 4px var(--turmeric),0 0 0 6px var(--ink)}
#panel .actno{display:block;font:700 .34em/1 system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--madder);margin-bottom:.35em}
#panel small{display:block;font-size:.42em;font-style:italic;margin-top:.3em;opacity:.85}
#who{display:block;font:700 .5em/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--madder);margin-bottom:.25em}
#hint{display:none;position:absolute;right:2.6%;top:2.2%;font:12px system-ui,sans-serif;color:var(--ink);background:rgba(243,231,201,.75);padding:1px 6px;border-radius:3px}
.hit-stick{transition:transform .07s linear}
.ring{transform-box:fill-box;transform-origin:center;animation:ring .5s ease-out forwards}
@keyframes ring{from{transform:scale(.3);opacity:.9}to{transform:scale(2.2);opacity:0}}
.note{animation:note 1.1s ease-out forwards}
@keyframes note{from{transform:translateY(0);opacity:1}to{transform:translateY(-120px);opacity:0}}
.puff{transform-box:fill-box;transform-origin:center;animation:puff .3s steps(3)}
@keyframes puff{0%{transform:scale(1)}40%{transform:scale(1.2,.85)}100%{transform:scale(1)}}
.fw{transform-box:fill-box;transform-origin:center;animation:fw 1.1s ease-out forwards}
@keyframes fw{from{transform:scale(.1);opacity:1}to{transform:scale(1.6);opacity:0}}
.fadein{animation:fadein .5s steps(5) both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.slide{animation:slide .8s steps(8) both}
@keyframes slide{from{transform:translateX(var(--dx,-300px))}to{transform:none}}
#turn{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:var(--madder);color:var(--cream);text-align:center;padding:24px;font-family:var(--display);font-size:clamp(28px,9vw,44px);line-height:1.15}
@media (orientation:portrait){html.phone #turn{display:grid}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="frame">
  <svg id="stage" viewBox="0 0 1600 900" role="img" aria-label="A medieval-miniature palace scene">
    <defs>
      <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><rect width="26" height="26" fill="#F2B91E"/><circle cx="13" cy="13" r="6" fill="#F3E7C9" stroke="#1b1210" stroke-width="1.5"/><circle cx="13" cy="13" r="2.4" fill="#B4251D"/></pattern>
      <pattern id="floorpat" width="60" height="40" patternUnits="userSpaceOnUse"><rect width="60" height="40" fill="#F2B91E"/><path d="M0 20L30 0L60 20L30 40Z" fill="#E8662A" stroke="#1b1210" stroke-width="2"/><circle cx="30" cy="20" r="5" fill="#F3E7C9"/></pattern>
      <pattern id="robepat" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#F3E7C9"/><circle cx="11" cy="11" r="4" fill="#2F4B8F"/></pattern>
      <clipPath id="inner"><rect x="40" y="40" width="1520" height="820"/></clipPath>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2B91E"/><stop offset=".55" stop-color="#F6D88F"/><stop offset="1" stop-color="#F3E7C9"/></linearGradient>
    </defs>
    <rect width="1600" height="900" fill="#F2B91E"/>
    <g clip-path="url(#inner)"><g id="scene"></g><g id="parts"></g><g id="fx"></g></g>
    <rect x="0" y="0" width="1600" height="900" fill="none" stroke="url(#dots)" stroke-width="80"/>
    <rect x="40" y="40" width="1520" height="820" fill="none" stroke="#1b1210" stroke-width="5"/>
  </svg>
  <div id="cap" class="blank"></div>
  <div id="panel" class="blank"></div>
  <div id="tally" class="blank"><span class="tl"></span><span class="tv"></span></div>
  <div id="hint">press space</div>
</div>
<div id="turn" role="alert">Turn your phone sideways</div>
<script src="kit.js"></script>
<script src="sound.js"></script>
<script src="parts.js"></script>
<script src="parts2.js"></script>
<script src="fix.js"></script>
<script src="story.js"></script>
<script src="story-act2.js"></script>
<script src="story-act3.js"></script>
<script src="story-act4.js"></script>
<script src="story-end.js"></script>
<script src="app.js"></script>
</body>
</html>
