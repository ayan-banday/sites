<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1B1024">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bhonpu Boss: Dialogue Maar!</title>
<meta name="description" content="Bhonpu Boss: a filmi leadership game. Kab bolna, kab sunna.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Yatra+One&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --ink:#1b0f2e; --saffron:#ff9f1c; --magenta:#e5197d; --peacock:#0b7a9e; --parrot:#2dbf5b; --cream:#fff3d6; --yellow:#ffd23f;
  --sa-t:env(safe-area-inset-top,0px); --sa-r:env(safe-area-inset-right,0px); --sa-b:env(safe-area-inset-bottom,0px); --sa-l:env(safe-area-inset-left,0px);
  --display:"Yatra One","Rozha One",Georgia,serif; --body:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;overscroll-behavior:none;
  touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;font-family:var(--body);color:var(--cream)}
#app{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);touch-action:none;--u:1px}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{pointer-events:none}
#ui>button,#talk{pointer-events:auto}

.hud{position:absolute;border:0;color:var(--cream);font-family:var(--body);cursor:pointer;touch-action:none;
  background:var(--ink);border:3px solid var(--yellow);box-shadow:0 3px 0 #000a}
#mute{top:max(8px,var(--sa-t));right:max(8px,var(--sa-r));width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
#mute.off #mute-on{display:none} #mute:not(.off) #mute-off{display:none}
#bhonpu{right:max(14px,var(--sa-r));bottom:max(14px,var(--sa-b));width:80px;height:80px;border-radius:50%;
  background:var(--magenta);border-color:var(--yellow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  transition:transform .08s}
#bhonpu .lbl{font:800 11px/1 var(--body);letter-spacing:.06em;margin-top:2px}
#bhonpu.down{transform:scale(1.12);background:var(--saffron)}

/* subtitles */
#bark{position:absolute;left:50%;top:max(8px,var(--sa-t));transform:translateX(-50%);width:min(calc(100% - 140px),620px);display:flex;flex-direction:column;align-items:center}
.line{display:flex;gap:10px;align-items:center;background:var(--ink);border:3px solid var(--cl,var(--yellow));border-radius:14px;
  padding:8px 12px;box-shadow:0 4px 0 #000a;font-size:max(16px,calc(var(--u)*17));line-height:1.25;width:100%}
#bark .line{animation:drop .18s ease-out}
@keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
#talk{position:absolute;left:50%;bottom:max(12px,var(--sa-b));transform:translateX(-50%);width:min(calc(100% - 230px),640px);cursor:pointer}
#talk .line{align-items:flex-start;padding:10px 14px;font-size:max(17px,calc(var(--u)*19));min-height:calc(var(--u)*84)}
.pt{flex:none;width:calc(var(--u)*54);height:calc(var(--u)*54);min-width:44px;min-height:44px;border-radius:10px;border:3px solid var(--cl,var(--yellow));background:#0006;overflow:hidden;display:grid;place-items:center}
.pt:empty{display:none}
.pt canvas,.pt img{width:100%;height:100%;object-fit:cover;display:block}
.txt{flex:1;min-width:0}
.who{display:block;font:800 .8em/1.1 var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--cl,var(--yellow));margin-bottom:2px}
.say{display:block;font-weight:500}
.w{display:inline-block;white-space:nowrap}
.c{opacity:0;transition:opacity .07s}
.c.on{opacity:1}
.more{position:absolute;right:14px;bottom:6px;font-size:14px;color:var(--yellow);animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* full-screen panels */
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:radial-gradient(circle at 50% 40%,#3b1857,var(--ink) 70%);text-align:center;
  padding:max(16px,var(--sa-t)) max(16px,var(--sa-r)) max(16px,var(--sa-b)) max(16px,var(--sa-l))}
#rotate{z-index:30;--u:min(1vw,1.6vh)}
.screen .title{font:clamp(28px,9vmin,64px)/1.05 var(--display);color:var(--yellow);text-shadow:0 4px 0 var(--magenta),0 7px 0 #000a}
.screen .sub{font:600 clamp(16px,3.4vmin,22px)/1.2 var(--body);color:var(--cream);opacity:.9}
#start{cursor:pointer}
#start .title{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.bar{width:min(60vw,320px);height:14px;border:3px solid var(--yellow);border-radius:9px;overflow:hidden;background:#0006}
.bar i{display:block;height:100%;width:0;background:var(--saffron);transition:width .12s}
.phone{width:56px;height:96px;border:5px solid var(--cream);border-radius:12px;position:relative;animation:rotphone 2.4s ease-in-out infinite;margin-bottom:8px}
.phone i{position:absolute;left:50%;bottom:6px;width:16px;height:4px;margin-left:-8px;border-radius:2px;background:var(--cream)}
@keyframes rotphone{0%,15%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.phone,#start .title{animation:none}}

/* ================= BHONPU BOSS ================= */
:root{--haldi:#FFD21F;--chilli:#E02B2B;--lilac:#9B6BD6;--peacock2:#0E7C86;--chrome:#AEB8C4;--side:max(var(--sa-l),var(--sa-r))}
#safe-probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
/* subtitle banner: cream card, speaker pill, top centre, in the space between the left HUD column and the right buttons */
#bark{top:max(6px,var(--sa-t));width:min(calc(100% - 2 * (112px + var(--side))),640px)}
#bark .line{background:#FFF3D6;color:#1B1024;border:3px solid #1B1024;border-radius:12px;box-shadow:0 4px 0 #1B1024a0;padding:5px 11px 6px;
  font-size:16px;line-height:1.22;display:block;position:relative}
#bark .line::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-8px;border:8px solid transparent;border-top-color:#1B1024;border-bottom:0}
#bark .who{display:inline-block;background:var(--cl);color:#FFF3D6;border:2px solid #1B1024;border-radius:99px;padding:0 8px;margin:0 6px 0 0;font-size:16px;line-height:1.3;vertical-align:baseline;text-shadow:0 1px 0 #1B1024}
#bark .txt{display:block}
#bark .say{display:inline;font-weight:700}
#bark .pt{display:none}
@media (min-width:1000px){#bark .line,#bark .who{font-size:max(16px,calc(var(--u)*15))}}
/* hud buttons: right cluster = pause + mute; the flashback reel sits in the left HUD column */
#mute{width:44px;height:44px;top:max(6px,var(--sa-t));right:max(8px,var(--sa-r))}
#pause{top:max(6px,var(--sa-t));right:calc(max(8px,var(--sa-r)) + 52px);width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
#reel{top:calc(max(0px,var(--sa-t)) + var(--u) * 104);left:max(10px,var(--sa-l));width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--haldi);pointer-events:none!important}
#reel.used{color:#5a5266;border-color:#5a5266}
#reel.used::after{content:"";position:absolute;width:30px;height:3px;background:#E02B2B;transform:rotate(-45deg)}
.menu #pause,.menu #reel,.menu #bhonpu,#app:not(.playing) #pause,#app:not(.playing) #reel,#app:not(.playing) #bhonpu{display:none}
.menu #mute{z-index:20}
/* the BHONPU button: 96 css px, centred at (right-72-safe, bottom-72-safe) */
#bhonpu{width:96px;height:96px;right:calc(24px + var(--sa-r));bottom:calc(24px + var(--sa-b));border-width:4px}
#bhonpu svg{width:50px;height:50px}
#bhonpu .lbl{font-size:16px;line-height:1}
#bhonpu .kb{position:absolute;bottom:-21px;font:800 16px/1 var(--body);background:#1B1024;border:2px solid var(--yellow);border-radius:6px;padding:1px 6px;display:none}
@media (hover:hover) and (pointer:fine){#bhonpu .kb{display:block}}
#bhonpu::after{content:attr(data-flash);position:absolute;bottom:104px;right:0;white-space:nowrap;font:24px/1 var(--display);color:var(--haldi);
  text-shadow:0 3px 0 #1B1024,2px 0 0 #1B1024,-2px 0 0 #1B1024,0 -2px 0 #1B1024;animation:blink .5s steps(2) infinite}
#bhonpu[data-flash=""]::after{display:none}
#bhonpu.pulse{animation:hornpulse .7s ease-in-out infinite}
#bhonpu.wobble{animation:wob .166s linear infinite}
#bhonpu.blocked{filter:grayscale(.7) brightness(.8)}
@keyframes hornpulse{50%{transform:scale(1.14);box-shadow:0 0 0 10px #FFD21F55,0 3px 0 #000a}}
@keyframes wob{25%{transform:rotate(4deg)}75%{transform:rotate(-4deg)}}
/* result mudflap: one big stamp, one line, the score. Never under the horn. Tap to skip. */
.flap{position:absolute;pointer-events:none;background:#1B1024;color:#FFF3D6;border:4px solid var(--chrome);border-radius:6px 6px 14px 14px;
  box-shadow:inset 0 0 0 3px #1B1024,inset 0 0 0 6px var(--haldi),0 6px 0 #0008;text-align:center;font-family:var(--body);
  left:max(10px,var(--sa-l));bottom:calc(var(--u)*30);padding:10px 14px;transform-origin:50% -40px;transform:rotate(-70deg);opacity:0;transition:transform .45s cubic-bezier(.3,1.6,.5,1),opacity .2s}
.flap.in{transform:rotate(0);opacity:1}.flap.out{transform:rotate(60deg);opacity:0}
.flap.big{left:calc(var(--sa-l) + 64px);right:calc(var(--sa-r) + 136px);width:auto;max-width:600px;margin:0 auto;bottom:calc(var(--u)*34 + var(--sa-b));padding:8px 14px 10px;font-size:16px;line-height:1.25;pointer-events:auto;cursor:pointer;display:flex;gap:12px;align-items:center;text-align:left}
.flap.big{transform:rotate(-70deg)}.flap.big.in{transform:none}.flap.big.out{transform:rotate(60deg)}
.rf-stamp{flex:none;font:normal 26px/1 var(--display);padding:7px 8px 3px;border:4px solid currentColor;border-radius:8px;transform:rotate(-8deg);animation:slam .35s cubic-bezier(.2,1.8,.4,1) both}
.rf-stamp.ok{color:#7fe06a}.rf-stamp.over{color:#ff6b6b}.rf-stamp.under{color:#c9a8ff}
@keyframes slam{from{transform:rotate(-8deg) scale(2.6);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.rf-body{flex:1;min-width:0}
.rf-line{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rf-line b{font:normal 1.15em var(--display)}
.rf-pts{flex:none;text-align:center;font:normal 34px/1 var(--display);color:var(--haldi)}.rf-pts small{display:block;font:800 16px/1.1 var(--body);color:#FFF3D6}
.q-DIRECT{color:#FF8C1A}.q-COACH{color:#FFD21F}.q-SUPPORT{color:#FF5FB0}.q-DELEGATE{color:#3FC4CF}.q-FROZE,.q-NONE{color:#AEB8C4}
.chip{display:inline-block;border:2px solid #1B1024;border-radius:99px;padding:1px 10px;font:800 16px/1.4 var(--body);background:#FFF3D6;color:#1B1024}
.chip.ok{background:#43B02A;color:#fff}.chip.over{background:var(--chilli);color:#fff}.chip.under{background:var(--lilac);color:#fff}
/* the CHAHIYE THA loss card: big stamp, crying face, two short lines, buttons at once */
.card{position:absolute;left:calc(max(10px,var(--sa-l)) + 52px);right:calc(var(--sa-r) + 128px);margin:0 auto;max-width:580px;top:52%;transform:translateY(-50%) rotate(-60deg);transform-origin:50% -80px;opacity:0;
  transition:transform .5s cubic-bezier(.3,1.5,.5,1),opacity .2s;background:#1B1024;color:#FFF3D6;border:5px solid var(--chrome);border-radius:8px 8px 20px 20px;
  box-shadow:inset 0 0 0 4px #1B1024,inset 0 0 0 8px var(--chilli),0 10px 0 #000a;padding:12px 16px 14px;font-size:16px;pointer-events:auto}
.card.in{transform:translateY(-50%);opacity:1}
.card-top{display:flex;gap:12px;align-items:center}
.card .face{width:72px;height:72px;flex:none;border:3px solid var(--haldi);border-radius:50%;overflow:hidden;background:#3a2a4a}
.card .face canvas{width:100%;height:100%}
.card-kind{font:normal 34px/1 var(--display);color:var(--chilli);text-shadow:0 3px 0 #000;transform:rotate(-2deg);margin-top:4px;animation:slam .35s cubic-bezier(.2,1.8,.4,1) both}.card-kind.gumshuda{color:var(--lilac)}
.card-cost{font-weight:800;font-size:16px;color:#FFF3D6;margin-top:4px}
.card-row{margin-top:8px;padding:5px 10px;border-radius:8px;background:#ffffff12;font-weight:700;font-size:16px}
.card-row b{font:normal 1.2em var(--display)}
.card-row .need{color:var(--haldi)}.card-row .over{color:#ff7a7a}.card-row .under{color:#c9a8ff}
.card-btns{display:flex;gap:12px;justify-content:center;margin-top:10px}
.btn{position:relative;overflow:hidden;min-width:120px;min-height:56px;padding:8px 18px;border:3px solid #1B1024;border-radius:12px;background:#FFF3D6;color:#1B1024;
  font:normal 20px/1 var(--display);box-shadow:0 5px 0 #1B1024;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1B1024}
.btn.fb,.btn.big{background:var(--haldi)}
.btn.guard{opacity:.55}
.card .btn{min-height:64px;font-size:22px}
.btn .cd{position:absolute;left:0;bottom:0;height:6px;width:100%;background:var(--chilli);transform-origin:left;animation:cd linear forwards}
html.paused-game .btn .cd{animation-play-state:paused}
@keyframes cd{to{transform:scaleX(0)}}
/* start screen over the painted title */
#start.title-mode{background:transparent;justify-content:flex-end;padding-bottom:calc(var(--sa-b) + 13vh)}
#start.title-mode .title{visibility:hidden;position:absolute}
#start.title-mode .sub{font-size:16px;background:#1B1024c0;border-radius:10px;padding:4px 12px}
/* pause menu */
#pausemenu{z-index:20;background:#1B1024e8}
/* rotate screen: Tota flapping */
#rotate-tota{width:120px;height:120px;animation:flap 0.5s ease-in-out infinite alternate}
@keyframes flap{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-8px) rotate(4deg)}}
/* poster: the art alone on the left, name plate + buttons on the right */
#poster{z-index:15;background:#1B1024;flex-direction:row;gap:14px;padding:max(10px,var(--sa-t)) max(12px,var(--sa-r)) max(10px,var(--sa-b)) max(12px,var(--sa-l))}
.poster-wrap{flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:center}
#poster-c{display:block;border-radius:6px;box-shadow:0 8px 0 #000a}
.poster-side{flex:none;width:min(36%,300px);display:flex;flex-direction:column;gap:10px;align-items:stretch;justify-content:center}
.poster-side .btn{min-height:48px;font-size:18px;min-width:0}
.nameplate{display:flex;flex-direction:column;gap:4px;background:linear-gradient(#F2F6FA,#AEB8C4 55%,#5E6B78);border:3px solid #1B1024;border-radius:10px;padding:6px 8px;box-shadow:0 0 0 3px #FFD21F,0 4px 0 #1B1024;color:#1B1024}
.nameplate span{font:800 16px/1 var(--body);letter-spacing:.06em}
.nameplate input{font:normal 22px/1.1 var(--display);color:#E6007E;background:#FFF3D6;border:2px solid #1B1024;border-radius:6px;padding:6px 8px;width:100%;min-height:44px;user-select:text;-webkit-user-select:text;touch-action:manipulation}
.dl-msg{font:700 16px/1.25 var(--body);color:var(--haldi);text-align:center}
#report{z-index:16;background:#1B1024;justify-content:flex-start;align-items:stretch;text-align:left;font-size:16px;gap:8px;
  padding:max(10px,var(--sa-t)) max(14px,var(--sa-r)) max(10px,var(--sa-b)) max(14px,var(--sa-l))}
.rep-head{display:flex;align-items:center;gap:14px}.rep-head .btn{min-height:44px;min-width:0;font-size:18px}
.rep-title{font:normal 24px var(--display);color:var(--haldi)}
#report-body{flex:1;min-height:0;display:flex;gap:14px}
.rep-grid{flex:0 0 42%;display:flex;flex-direction:column;align-items:center;min-height:0}
.rep-grid svg{width:100%;height:100%;max-height:calc(100% - 28px);font-family:var(--body)}
.rep-grid .pt{cursor:pointer}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:16px;font-weight:700}
.legend i{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:3px}
.legend .ring{border:3px solid #FFD21F;border-radius:50%}.legend .stamp{background:#FF8C1A;border:2px solid #000;border-radius:3px}
.legend .ov{height:4px;background:var(--chilli)}.legend .un{height:4px;background:var(--lilac)}
.rep-rows{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px;touch-action:pan-y}
.row{flex:none;background:#ffffff10;border-radius:10px;padding:7px 10px;min-height:46px;border:2px solid transparent}
.row.hl{animation:hl 1.2s}
@keyframes hl{0%,60%{border-color:#FFD21F;background:#FFD21F30}}
.row .l1{font-size:16px;font-weight:600}.row .l1 b{color:var(--haldi);font-weight:800}
.row .l2{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.row .chip{font-size:16px}.row .chip.need{background:var(--c);}.row .chip.call{background:var(--c)}.row .chip.pts{background:#FFD21F}.row .chip.lost{background:#1B1024;color:#FFF3D6;border-color:var(--chilli)}.row .chip.reel{background:#C8A060}
#report-foot{font:normal 16px var(--display);color:var(--haldi);text-align:center}
html.is-portrait-blocked #poster,html.is-portrait-blocked #report{display:none}
#ui>#card,#ui>#flap.big{pointer-events:auto}
.menu #stage{z-index:17;pointer-events:none}.menu #stage *{pointer-events:none}.menu #stage #mute{pointer-events:auto}.menu #c{visibility:hidden}
#poster-c.reveal{animation:wipe 1.3s cubic-bezier(.3,.7,.3,1) both}@keyframes wipe{from{clip-path:polygon(0 0,0 0,0 100%,0 100%)}to{clip-path:polygon(0 0,140% 0,100% 100%,0 100%)}}
/* poster/report: the narrator's bark sits over the side column (under mute), never over the poster's title */
.menu #bark{left:auto;right:max(12px,var(--sa-r));transform:none;top:calc(max(6px,var(--sa-t)) + 52px);width:min(36%,300px);z-index:18}
/* short landscape phones: a tighter loss card so it stays inside the safe area */
@media (max-height:400px){.card{padding:8px 12px 10px}.card .face{width:56px;height:56px}.card-kind{font-size:27px}.card-row{margin-top:5px;padding:3px 9px}.card-btns{margin-top:7px}.card .btn{min-height:52px;font-size:20px}}
/* loss card: the countdown bar holds while a line plays; desktop shows the key letters */
.card.talking .btn .cd{animation-play-state:paused}
.btn .key{display:none;margin-left:8px;font:800 16px/1 var(--body);border:2px solid currentColor;border-radius:5px;padding:2px 6px;vertical-align:3px}
@media (hover:hover) and (pointer:fine){.btn .key{display:inline-block}}
/* result flap lives in the top band (under the subtitle), on the side away from the teammate, so their reaction stays visible */
.flap.big.side-l,.flap.big.side-r{top:calc(max(6px,var(--sa-t)) + 82px);bottom:auto;max-width:min(64%,480px);margin:0}
.flap.big.side-l{left:calc(max(10px,var(--sa-l)) + 56px);right:auto}
.flap.big.side-r{right:calc(max(10px,var(--sa-r)) + 8px);left:auto}
.flap.big.side-l .rf-stamp,.flap.big.side-r .rf-stamp{font-size:22px}

</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="ui">
      <div id="bark" aria-live="polite"></div>
      <div id="talk" data-nodrag hidden></div>
      <div id="flap" class="flap" hidden></div>
      <div id="card" class="card" data-nodrag hidden></div>
      <div id="reel" class="hud" aria-label="Flashback reel" title="Flashback: 1 per game"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="7" r="2.2" fill="currentColor"/><circle cx="12" cy="17" r="2.2" fill="currentColor"/><circle cx="7" cy="12" r="2.2" fill="currentColor"/><circle cx="17" cy="12" r="2.2" fill="currentColor"/></svg></div>
      <button id="pause" class="hud" data-nodrag aria-label="Pause"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg></button>
      <button id="mute" class="hud" data-nodrag aria-label="Mute">
