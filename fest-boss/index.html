<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Fest Boss: Lead the Situation</title>
  <meta name="description" content="A pixel runner about leading people. Read your team, pick the right road, and save the fest.">
  <meta name="theme-color" content="#1B1530">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
/* Fest Boss 2: the canvas fills the screen and every piece of UI is an overlay on top of it.
   All sizes come from --u, a unit derived from the game's own box, so the UI looks the same on an
   800x360 phone in landscape and a 1440x900 laptop. */

:root {
  --ink: #1B1530;
  --night: #2B2350;
  --night-2: #3A3068;
  --cream: #FFF6E5;
  --paper: #FFFDF7;
  --muted: #6B6485;
  --heart: #FF4D6D;
  --gold: #FFC93C;
  --orange: #FF8A3D;
  --pink: #FF8FC7;
  --grass: #6BCB5A;
  --riya: #9B6BFF;
  --zib: #2EC4B6;
  --gorp: #8DBB3A;
  --blorb: #C98B5A;
  --bunty: #6E7FD8;
  --c-direct: #FF8A3D;
  --c-coach: #FFC93C;
  --c-support: #FF8FC7;
  --c-delegate: #2EC4B6;

  --font-pixel: "Pixelify Sans", ui-monospace, "Courier New", monospace;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --pop: cubic-bezier(.34, 1.56, .64, 1);
  --sa-t: env(safe-area-inset-top, 0px);
  --sa-r: env(safe-area-inset-right, 0px);
  --sa-b: env(safe-area-inset-bottom, 0px);
  --sa-l: env(safe-area-inset-left, 0px);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--ink);
  overscroll-behavior: none;
}
body {
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 700;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

/* ---------- Stage ---------- */
#stage-wrap {
  position: fixed; inset: 0;
  width: 100vw; height: 100vh;
  width: 100dvw; height: 100dvh;
  background: var(--ink);
  overflow: hidden;
}
#stage {
  display: block;
  width: 100% !important;
  height: 100% !important;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  outline: none;
  touch-action: none;
}
#stage-loading {
  position: absolute; inset: 0; z-index: 30;
  display: grid; place-items: center;
  background: var(--ink); color: var(--cream);
  font-family: var(--font-pixel); font-weight: 700;
  font-size: clamp(18px, 4vw, 30px);
}
#stage-loading .dots::after { content: ""; animation: dots 1.2s steps(1) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

/* ---------- Overlay frame ---------- */
#overlay {
  position: absolute; inset: 0; z-index: 10;
  pointer-events: none;
  touch-action: none;
}
/* The frame is the game's letterboxed rectangle (aspect set by ui.js from view.js, default 400x180). */
.ov-frame {
  --ar: 2.2222;
  position: absolute; inset: 0; margin: auto;
  width: min(100%, calc(100dvh * var(--ar)));
  height: min(100%, calc(100dvw / var(--ar)));
  container-type: size;
}
.ov-root {
  position: absolute; inset: 0;
  /* base unit: ~4.5 px on an 800x360 phone, ~8 px on a 1440x900 laptop */
  --u: clamp(2.4px, min(1.25vh, .62vw), 12px);
  --bw: max(3px, calc(var(--u) * .65));
  --sh: calc(var(--u) * .9);
  --r: calc(var(--u) * 2.2);
  --pad: calc(var(--u) * 2);
  --fs-xs: max(13px, calc(var(--u) * 2.9));
  --fs-s: max(14px, calc(var(--u) * 3.2));
  --fs-m: max(15px, calc(var(--u) * 3.7));
  font-size: var(--fs-s);
  line-height: 1.25;
}
@supports (width: 1cqw) {
  .ov-root { --u: clamp(2.4px, min(1.25cqh, .62cqw), 12px); }
}
.layer { position: absolute; inset: 0; pointer-events: none; }
.l-screens { z-index: 1; }
.l-hud { z-index: 3; }
.l-tip { z-index: 4; }
.l-bark { z-index: 5; }
.l-toast { z-index: 6; }
.l-chapter { z-index: 7; }

.screen {
  position: absolute; inset: 0;
  padding: max(var(--pad), var(--sa-t)) max(var(--pad), var(--sa-r)) max(var(--pad), var(--sa-b)) max(var(--pad), var(--sa-l));
  pointer-events: none;
  animation: fadein .25s ease-out backwards;
}
.screen.modal { pointer-events: auto; touch-action: none; }
.screen.out { animation: fadeout .24s ease-in forwards; pointer-events: none; }

/* ---------- Shared pieces ---------- */
.card {
  background: var(--cream);
  border: var(--bw) solid var(--ink);
  border-radius: var(--r);
  box-shadow: 0 var(--sh) 0 var(--ink);
}
.btn {
  --bg: var(--gold);
  font-family: var(--font-pixel); font-weight: 700;
  font-size: max(17px, calc(var(--u) * 4.6));
  color: var(--ink);
  min-height: max(44px, calc(var(--u) * 10));
  padding: 0 calc(var(--u) * 3.6);
  border: var(--bw) solid var(--ink);
  border-radius: calc(var(--u) * 1.8);
  background: var(--bg);
  box-shadow: 0 var(--sh) 0 var(--ink);
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  text-decoration: none;
  transition: transform 90ms ease, box-shadow 90ms ease, filter 120ms ease, opacity 200ms ease;
  -webkit-appearance: none; appearance: none;
}
.btn.alt { --bg: var(--cream); }
.btn:hover:not(:disabled) { transform: translateY(calc(var(--u) * -.4)); box-shadow: 0 calc(var(--sh) + var(--u) * .4) 0 var(--ink); filter: brightness(1.05); }
.btn:active:not(:disabled) { transform: translateY(calc(var(--sh) * .8)); box-shadow: 0 calc(var(--u) * .1) 0 var(--ink); }
.btn:focus-visible {
  outline: max(3px, calc(var(--u) * .7)) solid #fff; outline-offset: max(2px, calc(var(--u) * .4));
}
.btn:disabled { opacity: .45; filter: grayscale(.5); cursor: default; }

.portrait {
  --ps: calc(var(--u) * 9);
  flex: none;
  width: var(--ps); height: var(--ps);
  display: grid; place-items: center;
  background: var(--pc, var(--gold));
  background: color-mix(in srgb, var(--pc, #FFC93C) 42%, #FFF6E5);
  border: max(2px, calc(var(--u) * .5)) solid var(--ink);
  border-radius: calc(var(--u) * 1.6);
  overflow: hidden;
}
.portrait img { width: 84%; height: 84%; object-fit: contain; image-rendering: pixelated; }
.ph-initial { font-family: var(--font-pixel); font-weight: 700; font-size: calc(var(--ps) * .55); color: var(--ink); }
img { image-rendering: pixelated; -webkit-user-drag: none; }
.nosprite { display: inline-grid; place-items: center; font-size: .9em; line-height: 1; }

.caret {
  display: inline-block; width: .45em; height: 1em; margin-left: 2px;
  background: var(--ink); vertical-align: -.12em;
  animation: blink .8s steps(1) infinite;
}

.rchip {
  --lc: #FFD1D9;
  display: inline-flex; align-items: center; gap: calc(var(--u) * .7);
  padding: calc(var(--u) * .35) calc(var(--u) * 1.4);
  border: max(2px, calc(var(--u) * .45)) solid var(--ink);
  border-radius: 99px;
  background: var(--lc);
  font-family: var(--font-pixel); font-weight: 700; font-size: max(13px, calc(var(--u) * 2.9));
  line-height: 1.1; white-space: nowrap; color: var(--ink);
}
.rchip.lv-low { --lc: #FFD1D9; }
.rchip.lv-high { --lc: #CBEFB8; }
.rchip b { font-weight: 700; }
.ri { width: max(13px, calc(var(--u) * 3.2)); height: max(13px, calc(var(--u) * 3.2)); object-fit: contain; flex: none; }
.for { display: flex; align-items: center; gap: calc(var(--u) * .6); flex-wrap: nowrap; }
.for em { font-style: normal; font-weight: 800; font-size: max(13px, calc(var(--u) * 2.9)); color: var(--muted); }

/* ---------- Mute ---------- */
.mute {
  position: absolute; z-index: 9;
  top: max(calc(var(--u) * 1.6), var(--sa-t)); right: max(calc(var(--u) * 1.8), var(--sa-r));
  width: max(44px, calc(var(--u) * 9.5)); height: max(44px, calc(var(--u) * 9.5));
  padding: max(10px, calc(var(--u) * 2.1));
  background: var(--cream); color: var(--ink);
  border: var(--bw) solid var(--ink); border-radius: calc(var(--u) * 2);
  box-shadow: 0 calc(var(--u) * .6) 0 var(--ink);
  cursor: pointer; pointer-events: auto;
  transition: transform 90ms ease, box-shadow 90ms ease;
}
.mute svg { display: block; fill: currentColor; }
.mute .snd-off { display: none; }
.mute[aria-pressed="true"] { background: #E9DFC9; }
.mute[aria-pressed="true"] .snd-on { display: none; }
.mute[aria-pressed="true"] .snd-off { display: inline; }
.mute:hover { transform: translateY(calc(var(--u) * -.3)); }
.mute:active { transform: translateY(calc(var(--u) * .5)); box-shadow: 0 0 0 var(--ink); }
.mute:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

/* ---------- Title ---------- */
.screen.title {
  display: grid; place-items: center; text-align: center; cursor: pointer;
  background:
    radial-gradient(ellipse at center, rgba(27, 21, 48, .0) 30%, rgba(27, 21, 48, .6) 100%),
    linear-gradient(rgba(27, 21, 48, .5), rgba(27, 21, 48, .12) 45%, rgba(27, 21, 48, .6));
  outline: none;
}
.tt-center { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1.8); margin-top: calc(var(--u) * -4); }
.logo {
  --s: calc(var(--u) * .9);
  margin: 0;
  font-family: var(--font-pixel); font-weight: 700;
  font-size: max(40px, calc(var(--u) * 24));
  line-height: .9; letter-spacing: .02em;
  color: var(--gold);
  text-shadow:
    calc(var(--s) * -1) 0 var(--ink), var(--s) 0 var(--ink), 0 calc(var(--s) * -1) var(--ink), 0 var(--s) var(--ink),
    calc(var(--s) * -1) calc(var(--s) * -1) var(--ink), var(--s) calc(var(--s) * -1) var(--ink),
    calc(var(--s) * -1) var(--s) var(--ink), var(--s) var(--s) var(--ink),
    0 calc(var(--s) * 2.4) 0 var(--ink), calc(var(--s) * -1) calc(var(--s) * 2.4) 0 var(--ink), var(--s) calc(var(--s) * 2.4) 0 var(--ink);
  animation: bob 2.6s ease-in-out infinite;
  white-space: nowrap;
}
.logo span { display: inline-block; }
.logo span:last-child { animation: bob 2.6s ease-in-out -1.3s infinite; color: #FFD866; }
.tt-sub {
  margin: 0;
  font-family: var(--font-pixel); font-weight: 700; font-size: max(16px, calc(var(--u) * 4.8));
  color: var(--cream);
  background: rgba(27, 21, 48, .88);
  border: var(--bw) solid var(--gold); border-radius: 99px;
  padding: calc(var(--u) * .6) calc(var(--u) * 3.2);
}
.tt-tap {
  margin: calc(var(--u) * 1.8) 0 0;
  font-family: var(--font-pixel); font-weight: 700; font-size: max(24px, calc(var(--u) * 7.4));
  color: var(--cream); letter-spacing: .06em;
  text-shadow: 0 calc(var(--u) * .9) 0 var(--ink), 0 0 calc(var(--u) * 1.4) var(--ink), 0 0 0 var(--ink);
  -webkit-text-stroke: max(2px, calc(var(--u) * .5)) var(--ink);
  paint-order: stroke fill;
  animation: pulse 1.15s ease-in-out infinite;
}
.tt-mode {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: max(calc(var(--u) * 2.4), var(--sa-b));
  display: flex; overflow: hidden;
  background: var(--cream);
  border: var(--bw) solid var(--ink); border-radius: 99px;
  box-shadow: 0 calc(var(--u) * .7) 0 var(--ink);
}
.seg {
  font-family: var(--font-pixel); font-weight: 700; font-size: max(14px, calc(var(--u) * 3.3));
  color: var(--ink);
  min-height: max(44px, calc(var(--u) * 9));
  padding: 0 calc(var(--u) * 3);
  border: 0; background: transparent; cursor: pointer; white-space: nowrap;
  transition: background 120ms ease, filter 120ms ease;
}
.seg + .seg { border-left: var(--bw) solid var(--ink); }
.seg[aria-pressed="true"] { background: var(--gold); }
.seg:hover { filter: brightness(.96); }
.seg:active { filter: brightness(.88); }
.seg:focus-visible { outline: 3px solid var(--riya); outline-offset: -4px; }

/* ---------- Barks (walkie strip) ---------- */
.l-bark {
  display: flex; justify-content: center; align-items: flex-start;
  padding: max(calc(var(--u) * 1.6), var(--sa-t)) 0 0;
}
.bark {
  --pc: var(--gold);
  display: grid; grid-template-columns: auto 1fr; align-items: center; gap: calc(var(--u) * 1.4);
  max-width: min(calc(100% - var(--u) * 58), calc(var(--u) * 130));
  min-width: calc(var(--u) * 46);
  padding: calc(var(--u) * .9) calc(var(--u) * 1.8) calc(var(--u) * .9) calc(var(--u) * .9);
  background: var(--cream);
  border: var(--bw) solid var(--ink); border-radius: var(--r);
  box-shadow: 0 var(--sh) 0 var(--ink);
  animation: dropin .4s var(--pop) backwards;
}
.bark.out { animation: dropout .22s ease-in forwards; }
.bk-body { min-width: 0; }
.bk-name { display: flex; align-items: center; gap: calc(var(--u) * 1); margin-bottom: calc(var(--u) * .4); }
.bk-name span {
  font-family: var(--font-pixel); font-weight: 700; font-size: max(14px, calc(var(--u) * 3.1));
  background: var(--pc); color: var(--ink);
  border: max(2px, calc(var(--u) * .4)) solid var(--ink); border-radius: 99px;
  padding: 0 calc(var(--u) * 1.2); line-height: 1.25;
}
.bk-led { width: calc(var(--u) * 1.2); height: calc(var(--u) * 1.2); border-radius: 50%; background: var(--heart); box-shadow: 0 0 0 max(2px, calc(var(--u) * .35)) var(--ink); animation: blink .7s steps(1) infinite; }
.bk-text { display: block; font-size: max(14px, calc(var(--u) * 3.5)); font-weight: 800; line-height: 1.22; }

/* ---------- Dialogue ---------- */
.screen.dialogue { display: flex; align-items: flex-end; justify-content: center; }
.dl-box {
  --pc: var(--gold);
  position: relative;
  width: min(100%, calc(var(--u) * 150));
  display: grid; grid-template-columns: auto 1fr; gap: calc(var(--u) * 2); align-items: center;
  padding: calc(var(--u) * 1.6) calc(var(--u) * 2.6) calc(var(--u) * 2.4) calc(var(--u) * 1.6);
  animation: slideup .4s var(--pop) backwards;
}
.dl-box .portrait { --ps: calc(var(--u) * 15); }
.dl-main { min-width: 0; }
.dl-name {
  display: inline-block;
  font-family: var(--font-pixel); font-weight: 700; font-size: max(15px, calc(var(--u) * 3.8));
  background: var(--pc); border: max(2px, calc(var(--u) * .45)) solid var(--ink); border-radius: 99px;
  padding: 0 calc(var(--u) * 1.8); margin-bottom: calc(var(--u) * .8); line-height: 1.3;
}
.dl-text { margin: 0; font-size: max(15px, calc(var(--u) * 4)); font-weight: 800; line-height: 1.3; min-height: 2.6em; }
.dl-chev {
  position: absolute; right: calc(var(--u) * 2.2); bottom: calc(var(--u) * .6);
  display: flex; align-items: center; gap: calc(var(--u) * .7);
  font-family: var(--font-pixel); font-size: max(13px, calc(var(--u) * 2.9)); color: var(--muted);
  opacity: 0; transition: opacity .2s;
}
.dl-chev.ready { opacity: 1; }
.dl-chev i {
  width: 0; height: 0; border-left: calc(var(--u) * 1) solid transparent; border-right: calc(var(--u) * 1) solid transparent;
  border-top: calc(var(--u) * 1.3) solid var(--ink);
  animation: nudge .8s ease-in-out infinite;
}

/* ---------- Roads ---------- */
.screen.roads {
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: calc(var(--u) * 1.5);
  background: linear-gradient(rgba(27, 21, 48, .62), rgba(27, 21, 48, .4));
}
.rd-cap {
  justify-self: center; width: min(100%, calc(var(--u) * 135));
  display: grid; grid-template-columns: auto 1fr; gap: calc(var(--u) * 1.6); align-items: center;
  padding: calc(var(--u) * 1) calc(var(--u) * 2) calc(var(--u) * 1) calc(var(--u) * 1);
}
.rd-cap .portrait { --ps: calc(var(--u) * 9.5); --pc: var(--blorb); }
.rd-name { font-family: var(--font-pixel); font-weight: 700; font-size: max(14px, calc(var(--u) * 3.2)); color: var(--muted); line-height: 1.1; }
.rd-text { margin: 0; font-size: max(14px, calc(var(--u) * 3.6)); font-weight: 800; line-height: 1.22; min-height: 2.44em; }
.rd-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: calc(var(--u) * 1.6); min-height: 0; padding-bottom: calc(var(--u) * 1); }
.rd-card {
  --c: var(--gold);
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: calc(var(--u) * .5); padding: 0 calc(var(--u) * 1.2) calc(var(--u) * 1.4);
  overflow: hidden; min-height: 0;
  visibility: hidden;
}
.rd-card.show { visibility: visible; animation: popcard .55s var(--pop) backwards; }
.rd-tile {
  width: calc(100% + var(--u) * 2.4); margin: 0 calc(var(--u) * -1.2) calc(var(--u) * .5);
  background: var(--c); border-bottom: var(--bw) solid var(--ink);
  display: grid; place-items: center; padding: calc(var(--u) * 1) 0;
}
.rd-icon { width: calc(var(--u) * 10.6); height: calc(var(--u) * 10.6); object-fit: contain; }
.rd-name2 { font-family: var(--font-pixel); font-weight: 700; font-size: max(19px, calc(var(--u) * 5.4)); line-height: 1.05; }
.rd-tag { font-size: max(14px, calc(var(--u) * 3.2)); font-weight: 800; color: var(--muted); line-height: 1.15; }
.rd-quote { font-size: max(14px, calc(var(--u) * 3.1)); font-weight: 700; font-style: italic; line-height: 1.15; }
.rd-card .for { margin-top: auto; padding-top: calc(var(--u) * .6); flex-wrap: wrap; justify-content: center; }
.rd-foot { display: flex; justify-content: center; min-height: max(44px, calc(var(--u) * 10)); }
.rd-go { visibility: hidden; font-size: max(19px, calc(var(--u) * 5.2)); padding: 0 calc(var(--u) * 7); }
.rd-go.show { visibility: visible; animation: popcard .5s var(--pop) backwards; }

/* ---------- Chapter splash ---------- */
.chapter { position: absolute; left: 0; right: 0; top: 24%; overflow: hidden; padding-bottom: calc(var(--u) * 1.5); }
.ch-band {
  --pc: var(--gold);
  display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 2.6);
  padding: calc(var(--u) * 1.8) calc(var(--u) * 4);
  background: var(--ink);
  border-top: calc(var(--u) * .8) solid var(--gold); border-bottom: calc(var(--u) * .8) solid var(--gold);
  animation: bandin .5s cubic-bezier(.22, 1.2, .36, 1) backwards;
}
.chapter.out .ch-band { animation: bandout .35s ease-in forwards; }
.ch-band .portrait { --ps: calc(var(--u) * 14); }
.ch-text { display: flex; flex-direction: column; gap: calc(var(--u) * .3); }
.ch-kick { font-family: var(--font-pixel); font-weight: 700; font-size: max(16px, calc(var(--u) * 4.4)); color: var(--gold); letter-spacing: .08em; }
.ch-title { font-family: var(--font-pixel); font-weight: 700; font-size: max(24px, calc(var(--u) * 8)); color: var(--cream); line-height: 1; }
.ch-task {
  width: calc(var(--u) * 11); height: calc(var(--u) * 11);
  display: grid; place-items: center; background: var(--cream); border: var(--bw) solid var(--cream); border-radius: calc(var(--u) * 1.8);
}
.ch-icon { width: 78%; height: 78%; object-fit: contain; }

/* ---------- HUD ---------- */
.hud {
  position: absolute;
  top: max(calc(var(--u) * 1.6), var(--sa-t)); left: max(calc(var(--u) * 1.8), var(--sa-l));
  display: flex; flex-direction: column; align-items: flex-start; gap: calc(var(--u) * 1);
}
.hd-hearts {
  display: flex; gap: calc(var(--u) * .8);
  padding: calc(var(--u) * .9) calc(var(--u) * 1.6);

  margin: calc(var(--u) * 2.4) 0 0; text-align: center;
  font-family: var(--font-pixel); font-weight: 700; font-size: max(17px, calc(var(--u) * 4.6)); line-height: 1.2;
  background: var(--ink); color: var(--gold); border-radius: var(--r); padding: calc(var(--u) * 1.8);
}
.rp-foot {
  display: flex; gap: calc(var(--u) * 1.8); justify-content: center; flex-wrap: wrap;
  padding: calc(var(--u) * 1.6) calc(var(--u) * 2.4) calc(var(--u) * 2);
  border-top: var(--bw) solid var(--ink); background: #F6E8CB;
}
@container (max-width: 640px) {
  .rp-rows { grid-template-columns: 1fr; }
  .rp-head { grid-template-columns: 1fr; justify-items: start; }
}

/* ---------- Error ---------- */
.screen.error { display: grid; place-items: center; background: rgba(27, 21, 48, .85); }
.er-card { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 2); text-align: center; padding: calc(var(--u) * 3.5) calc(var(--u) * 5); }
.er-card p { margin: 0; font-size: max(15px, calc(var(--u) * 3.8)); font-weight: 800; }
.er-title { margin: 0; font-family: var(--font-pixel); font-weight: 700; font-size: max(22px, calc(var(--u) * 7)); }

/* ---------- Rotate your phone ---------- */
.rotate {
  --u: clamp(3px, 1.8vw, 8px);
  position: absolute; inset: 0; z-index: 20; pointer-events: auto; touch-action: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 3);
  padding: 24px; text-align: center; color: var(--cream);
  background: var(--ink);
}
.rot-stars {
  position: absolute; inset: 0; opacity: .5;
  background-image: radial-gradient(rgba(255, 246, 229, .8) 1px, transparent 1.5px), radial-gradient(rgba(255, 201, 60, .7) 1px, transparent 1.5px);
  background-size: 38px 38px, 61px 61px; background-position: 0 0, 19px 27px;
}
.rot-phone {
  position: relative; width: max(72px, calc(var(--u) * 15)); height: max(124px, calc(var(--u) * 26));
  background: var(--night); border: 5px solid var(--cream); border-radius: 14px; box-shadow: 0 6px 0 #000;
  animation: rotphone 2.8s ease-in-out infinite;
}
.rot-notch { position: absolute; top: 6%; left: 50%; width: 30%; height: 3%; background: var(--cream); border-radius: 9px; transform: translateX(-50%); }
.rot-heart {
  position: absolute; inset: 34% 24% 30%; background: var(--heart);
  clip-path: polygon(50% 100%, 0 42%, 0 18%, 18% 0, 40% 0, 50% 14%, 60% 0, 82% 0, 100% 18%, 100% 42%);
  animation: pulse 1.4s ease-in-out infinite;
}
.rot-title, .rot-sub { position: relative; margin: 0; }
.rot-title { font-family: var(--font-pixel); font-weight: 700; font-size: max(24px, calc(var(--u) * 6.4)); line-height: 1.1; color: var(--gold); }
.rot-sub { font-size: max(16px, calc(var(--u) * 3.6)); font-weight: 800; opacity: .85; }

/* ---------- Keyframes ---------- */
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeout { to { opacity: 0; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-.6deg); } 50% { transform: translateY(calc(var(--u) * -1.3)) rotate(.6deg); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@keyframes nudge { 50% { transform: translateY(calc(var(--u) * .6)); } }
@keyframes flash { 50% { filter: brightness(1.5); } }
@keyframes popcard { 0% { opacity: 0; transform: scale(.55) translateY(calc(var(--u) * 2)); } 100% { opacity: 1; transform: none; } }
@keyframes slideup { from { opacity: 0; transform: translateY(calc(var(--u) * 14)); } to { opacity: 1; transform: none; } }
@keyframes slideleft { from { opacity: 0; transform: translateX(calc(var(--u) * -12)); } to { opacity: 1; transform: none; } }
@keyframes dropin { from { opacity: 0; transform: translateY(calc(var(--u) * -14)); } to { opacity: 1; transform: none; } }
@keyframes dropout { to { opacity: 0; transform: translateY(calc(var(--u) * -10)); } }
@keyframes signin { from { opacity: 0; transform: translateX(110%); } to { opacity: 1; transform: none; } }
@keyframes bandin { from { transform: translateX(105%); } to { transform: none; } }
@keyframes bandout { to { transform: translateX(-105%); } }
@keyframes chosen { 0% { transform: translateY(0) scale(1); } 40% { transform: translateY(calc(var(--u) * .7)) scale(1.04); } 100% { transform: translateY(calc(var(--u) * .7)) scale(1); } }
@keyframes stamp { 0% { opacity: 0; transform: scale(2.4) rotate(-18deg); } 100% { opacity: 1; transform: scale(1) rotate(-3deg); } }
@keyframes toastpop {
  0% { opacity: 0; transform: scale(.3) rotate(-4deg); }
  16% { opacity: 1; transform: scale(1.18) rotate(-2deg); }
  28% { transform: scale(1) rotate(-2deg); }
  78% { opacity: 1; transform: translateY(0) rotate(-2deg); }
  100% { opacity: 0; transform: translateY(calc(var(--u) * -5)) rotate(-2deg); }
}
@keyframes crack {
  0% { transform: scale(1); filter: none; }
  14% { transform: scale(1.5) rotate(-10deg); filter: brightness(2.2); }
  34% { transform: translateX(calc(var(--u) * -.6)) rotate(8deg); }
  55% { transform: translateX(calc(var(--u) * .6)) rotate(-6deg); }
  100% { transform: scale(1); filter: none; }
}
@keyframes shard { 0% { opacity: 1; transform: translate(0, 0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(90deg); } }
@keyframes gain { 0% { transform: scale(.4); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
@keyframes tapbob { 0%, 100% { transform: translateY(0) scale(1); } 40% { transform: translateY(calc(var(--u) * 1.8)) scale(.93); } 55% { transform: translateY(calc(var(--u) * 1.8)) scale(.93); } }
@keyframes holdbob { 0%, 15% { transform: translateY(0) scale(1); } 30%, 80% { transform: translateY(calc(var(--u) * 1.8)) scale(.93); } 100% { transform: translateY(0) scale(1); } }
@keyframes ring { 0%, 35% { opacity: 0; transform: scale(.4); } 45% { opacity: 1; } 100% { opacity: 0; transform: scale(1.8); } }
@keyframes rise { 0% { opacity: 0; transform: translateY(calc(var(--u) * 2)); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(calc(var(--u) * -2.5)); } }
@keyframes rotphone { 0%, 12% { transform: rotate(0deg); } 45%, 72% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* The full-screen report card covers the corner; the mute button steps aside while it is up. */
.ov-root:has(.screen.report) .mute { display: none; }

</style>
