<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>The Cow Who Became Batman</title>
<meta name="description" content="a true story. mostly. for Gauri, on her 19th.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Patrick+Hand&family=Patrick+Hand+SC&family=Special+Elite&display=swap">
<style>
/* Night, cover and ending: Wada Sanzo No. 53, Dusky Madder Violet + Yellow Orange.
   Chapters: 1 No. 238 (Cotinga Purple, Ochraceous Salmon, Warm Gray) · 2 No. 190 (Ivory Buff, English Red, Black)
   3 No. 170 (Rosolanc Purple, Orange Yellow, Red Violet) · 4 No. 69 (Warm Gray, Black) · 5 No. 269 (Raw Sienna, Pale Burnt Lake, Aconite Violet, Black).
   All lettering sits on cream paper (#fdf4e3) in ink (#2b0d2a): about 15:1. */
:root{--night:#1d0a1c;--plum:#4e1d4c;--violet:#59256a;--pink:#b73f74;--gold:#fcb315;--amber:#f99d1b;--ink:#2b0d2a;--cream:#fdf4e3;--mist:#d9c3cf;
  --f-title:'Mochiy Pop One','Arial Rounded MT Bold','Trebuchet MS',sans-serif;--f-bub:'Patrick Hand SC','Comic Sans MS',cursive;--f-hand:'Patrick Hand','Comic Sans MS',cursive;--f-type:'Special Elite','Courier New',monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--cream)}
body{font-family:var(--f-hand);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
canvas.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- phone: two screens that snap ---------- */
html.phone,html.phone body{height:100%}
html.phone body{overflow-y:auto;scroll-snap-type:y mandatory}
.scr{position:relative;height:100%;min-height:560px;scroll-snap-align:start;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px max(16px,env(safe-area-inset-left,0px))}
.in{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;max-width:420px}
.scr h1{margin:0;font-family:var(--f-title);font-weight:400;font-size:clamp(32px,10vw,44px);line-height:1.12;color:var(--gold);text-shadow:3px 4px 0 var(--ink);transform:rotate(-2deg)}
.scr p{margin:0;font-family:var(--f-hand);font-size:clamp(23px,6.6vw,28px);line-height:1.3;color:var(--cream);text-wrap:balance}
.scr p b{font-weight:400;color:var(--gold)}
.cowart{width:min(80vw,330px);aspect-ratio:300/330}
.lap{width:min(62vw,230px);aspect-ratio:220/150}
.icon{display:inline-block;width:1.25em;height:1.25em;vertical-align:-.25em;margin-left:.2em}

/* ---------- laptop: cover sky, countdown, cover ---------- */
.sky{position:relative;min-height:max(640px,100vh);display:grid;place-items:center;overflow:hidden;text-align:center}
.cv{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;padding-block:80px;max-width:940px}
.cv h1{margin:0;font-family:var(--f-title);font-weight:400;font-size:clamp(40px,6.6vw,88px);line-height:1.08;color:var(--gold);text-wrap:balance;text-shadow:4px 5px 0 var(--ink),-1px -1px 0 var(--ink),1px 1px 0 var(--ink);transform:rotate(-1.5deg)}
.cv h1 span{display:inline-block}
.cv p{margin:0;font-family:var(--f-type);font-size:clamp(18px,1.7vw,22px);line-height:1.5;color:var(--cream)}
.clock{display:flex;gap:14px;align-items:flex-start;margin-top:6px}
.clock div{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--f-hand);font-size:17px;color:var(--mist)}
.clock b{display:block;min-width:2.1em;padding:.18em .25em .1em;font-family:var(--f-title);font-weight:400;font-size:clamp(40px,5vw,62px);line-height:1;color:var(--ink);background:var(--paper) center/100% 100% no-repeat;filter:drop-shadow(4px 5px 0 rgba(43,13,42,.55));font-variant-numeric:tabular-nums}
.clock i{font-family:var(--f-title);font-style:normal;font-size:clamp(34px,4vw,52px);color:var(--gold);line-height:1.3}
.cv p.opens{font-family:var(--f-hand);font-size:clamp(28px,2.8vw,38px);color:var(--gold);transform:rotate(-1deg)}
.btn{position:relative;font-family:var(--f-bub);font-size:30px;color:var(--ink);background:none;border:0;padding:14px 48px 16px;cursor:pointer;margin-top:10px}
.btn svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.btn span{position:relative}
.btn:focus-visible{outline:3px dashed var(--gold);outline-offset:6px}
.btn:hover .fillme{fill:var(--amber)}

/* ---------- the movie ---------- */
.offstage{position:fixed!important;left:-200vw;top:0;width:100vw;visibility:hidden}
.chapter{position:relative;padding-block:64px 96px;overflow:hidden}
.chapter>canvas.bg{opacity:1}
.page{position:relative;max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.row{display:grid;gap:20px;align-items:start}
.band,.panel{position:relative;container-type:inline-size}
.band{aspect-ratio:1120/190}
.panel{transition:opacity .8s ease,transform .8s ease;background:transparent}
.panel>canvas,.band>canvas{display:block;width:100%;height:100%;position:absolute;inset:0}
.panel .layer2{opacity:0;transition:opacity 2.4s ease}
.panel.cape .layer2{opacity:1}
.js .panel.hid{opacity:0;transform:translateY(16px)}
.t{position:absolute;margin:0;color:var(--ink);font-size:max(var(--min,0px),calc(var(--fs) * 100cqw / var(--W)));line-height:1.18}
.narr{--fs:23;--min:19px;font-family:var(--f-hand);padding:.45em .75em .5em;background:var(--paper) center/100% 100% no-repeat;filter:drop-shadow(4px 5px 0 rgba(43,13,42,.4))}
.narr small{display:block;font-family:var(--f-type);font-size:.68em;letter-spacing:.06em;opacity:.8;margin-bottom:.15em}
.bub{--fs:24;--min:18px;font-family:var(--f-bub);line-height:1.08;text-align:center;padding:.75em 1em .85em;background:var(--bub) center/100% 100% no-repeat}
.ash{--fs:8.6;font-family:var(--f-hand);line-height:1.08;padding:1.4em 1.9em;background:var(--ashbub) center/100% 100% no-repeat;overflow:visible;opacity:.95}
.ash .spill{display:block;height:var(--h);overflow:visible}
.tail{position:absolute;width:42px;height:38px;top:calc(100% - 6px);overflow:visible}
.tail.up{top:auto;bottom:calc(100% - 6px);transform:scaleY(-1)}
.tail.flip{transform:scaleX(-1)}.tail.up.flip{transform:scale(-1,-1)}
.lab{--fs:22;--min:16px;font-family:var(--f-hand);line-height:1;color:var(--ink)}
.lab.lt{color:var(--cream);text-shadow:2px 2px 0 var(--ink)}
.sign{--fs:20;font-family:var(--f-bub);line-height:1.02;text-align:center;color:var(--ink)}
.cnt{--fs:21;--min:16px;font-family:var(--f-bub);line-height:1.12;padding:.5em .7em;background:var(--paper) center/100% 100% no-repeat;filter:drop-shadow(4px 5px 0 rgba(43,13,42,.4))}
.cnt b{font-family:var(--f-title);font-weight:400;font-size:1.12em;color:var(--pink);background:none!important}
.ttl{--fs:46;font-family:var(--f-title);color:var(--cream);text-shadow:3px 4px 0 var(--ink);text-align:center;line-height:1.08}
.ttl small{display:block;font-family:var(--f-type);font-size:.4em;letter-spacing:.14em;text-shadow:2px 2px 0 var(--ink);margin-bottom:.3em}
.t.after{opacity:0;transition:opacity 2.4s ease}.panel.cape .t.after{opacity:1}
.bub.nobg{background:none;padding:0}
.sign.chalk{text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink)}
.big{--fs:64;font-family:var(--f-title);color:var(--gold);text-shadow:4px 5px 0 var(--ink);text-align:center;line-height:1.05;opacity:0;transform:scale(.92);transition:opacity 2.2s ease,transform 2.2s ease}
.done .big{opacity:1;transform:none}
/* marker highlights: a scribbled swipe, a circle or a burst behind the whole word */
.t b{font-weight:inherit;padding:0 .14em;margin:0 -.06em;background:var(--mk-swipe) center/100% 100% no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.t b.c{background-image:var(--mk-circle);padding:.1em .3em}
.t b.s{background-image:var(--mk-burst);padding:.15em .35em}
.hint{position:absolute;inset:0;display:none;place-items:center;font-family:var(--f-hand);font-size:22px;color:var(--gold);pointer-events:none;text-shadow:2px 2px 0 var(--ink)}
.panel.nexth .hint{display:grid}
.teaser{position:relative;max-width:1120px;margin:34px auto 0;display:flex;justify-content:flex-end;align-items:center;gap:14px;font-family:var(--f-hand);font-size:22px;color:var(--cream);transition:opacity .8s ease;cursor:pointer;text-shadow:2px 2px 0 var(--ink)}
.js .teaser.hid{opacity:0;pointer-events:none}
.teaser b{font-family:var(--f-bub);font-weight:400;font-size:27px;color:var(--gold)}
/* the two stars in each chapter's top band */
.bstar{position:absolute;top:70%;left:50%;width:7.2cqw;height:7.2cqw;margin:-3.6cqw 0 0 -3.6cqw;transition:transform 2.4s cubic-bezier(.3,.1,.2,1),opacity 2s ease}
.orbit{position:absolute;inset:0;animation:orbit 26s linear infinite;animation-play-state:paused}
.vis .orbit{animation-play-state:running}
@keyframes orbit{to{transform:rotate(360deg)}}
.pulse{animation:pulse 4.5s ease-in-out 1 both;animation-play-state:paused}
.vis .pulse{animation-play-state:running}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.raink{position:absolute;inset:-40% 0 0 0;background-repeat:repeat;opacity:.55;animation:rain 1.1s linear infinite;animation-play-state:paused;pointer-events:none}
.vis .raink{animation-play-state:running}
@keyframes rain{to{transform:translateY(25%)}}
.p-glow .glow{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease 1.2s}
.p-glow:not(.hid) .glow{opacity:1}
.fly{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.fly .trail{stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.flying .fly .trail{transition:stroke-dashoffset 8s cubic-bezier(.45,.05,.4,1);stroke-dashoffset:0}

/* ---------- the hand-drawn volume knob ---------- */
#knob{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;z-index:5;background:rgba(29,10,28,.86);padding:8px 16px 8px 8px;border-radius:40px}
#dial{width:62px;height:62px;cursor:grab;touch-action:none}
#dial:focus-visible{outline:3px dashed var(--gold);outline-offset:2px;border-radius:50%}
#knob .kl{font-family:var(--f-hand);font-size:17px;line-height:1.1;color:var(--cream);display:flex;align-items:center;gap:8px}
#knob .kl small{display:block;font-size:14px;color:var(--mist)}
#knob svg.ic{width:26px;height:26px;flex:none}
@media (prefers-reduced-motion:reduce){.panel,.bstar,.teaser,.big,.layer2{transition:none!important}.orbit,.raink,.pulse{animation:none!important}}
@media (max-width:860px){.row{grid-template-columns:1fr!important}}
</style>
</head>
<body>
<!-- phone: open today -->
<div id="phone" hidden>
  <section class="scr" aria-label="Happy 19th">
    <canvas class="bg" id="psky1"></canvas>
    <div class="in"><canvas class="cowart" id="pcow"></canvas><h1>happy 19th, cow</h1><svg class="icon" id="down" viewBox="0 0 34 34" style="width:36px;height:36px" aria-hidden="true"></svg></div>
  </section>
  <section class="scr" aria-label="Open it on a laptop">
    <canvas class="bg" id="psky2"></canvas>
    <div class="in"><canvas class="lap" id="plap"></canvas><p>This one’s a movie.<br><b>Open this same link on your laptop.</b><svg class="icon spk" viewBox="0 0 40 40" aria-hidden="true"></svg></p></div>
  </section>
</div>

<!-- laptop, before midnight -->
<section id="lock" class="sky" hidden aria-label="Opens at midnight">
  <canvas class="bg" id="lsky"></canvas>
  <div class="cv wrap">
    <h1><span>The Cow Who</span> <span>Became Batman</span></h1>
    <p class="opens">opens at midnight, cow</p>
    <div class="clock" role="timer" aria-live="off"><div><b id="hh">00</b>hours</div><i>:</i><div><b id="mm">00</b>minutes</div><i>:</i><div><b id="ss">00</b>seconds</div></div>
  </div>
</section>

<!-- laptop, from midnight -->
<main id="movie" hidden>
  <section id="cover" class="sky" aria-label="Cover">
    <canvas class="bg" id="csky"></canvas>
    <div class="cv wrap">
      <h1><span>The Cow Who</span> <span>Became Batman</span></h1>
      <p>a true story. mostly.<br>for Gauri, on her 19th.</p>
      <button class="btn" id="begin" type="button"><svg viewBox="0 0 200 70" preserveAspectRatio="none" aria-hidden="true" id="btnArt"></svg><span>begin</span></button>
    </div>
  </section>
  <div id="chapters"></div>
</main>

<div id="knob" hidden>
  <svg id="dial" viewBox="-36 -36 72 72" role="slider" tabindex="0" aria-label="Music volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="15"></svg>
  <div class="kl"><svg class="ic spk" viewBox="0 0 40 40" aria-hidden="true"></svg><div><span id="song">Risk It All · sung by Gauri</span><small id="vol">volume 15%</small></div></div>
</div>

<script src="kit.js"></script>
<script src="story.js"></script>
<script src="app.js"></script>
</body>
</html>
