<style>

<style>
  /* ===== Tokens. Day on :root; night redefines the same tokens (system dark, the host toggle, or the lantern). ===== */
  :root{
    --paper:#F4EEE3; --ink:#2A2622; --muted:#6F675E; --floor:#2A2622; --floor-ink:#F4EEE3;
    --card:#FBF8F2; --card-ink:#2A2622; --card-line:rgba(42,38,34,.16);
    /* hero */
    --h-sky1:#F7F2E9; --h-sky2:#F1DFC4; --h-plain:#E9DECB; --h-plain2:#E1D3BC; --h-ink:#2A2622; --h-muted:#6F675E;
    --h-veil:#1E1A20; --h-veil-o:0; --h-mist:#FBF7F0; --h-star-o:0;
    /* Mauna Kea */
    --mk-plum:#3A2E4A; --mk-violet:#6B5B86; --mk-cream:#F3E9D2; --mk-lilac:#B9B0C8; --mk-pop:#F2A541;
    --mk-sky0:#251D31; --mk-rock:#1E1726; --mk-sea0:#2C2541; --mk-sea1:#1A1526; --mk-glow-o:.55;
    /* Mayon */ --my-apricot:#F4B183; --my-ash:#6E6862; --my-water:#C9D3D9; --my-gold:#D9A441; --my-pop:#E8624A;
    /* Kazbek */ --kz-glacier:#EEF1F2; --kz-slate:#4A5560; --kz-ochre:#B98A5A; --kz-iron:#2F3236; --kz-pop:#E4572E;
    /* Valley */ --va-scree:#A39E95; --va-river:#7FA7C9; --va-pop:#E3A21A;
    /* Rainier */ --rn-ice:#BFD7EA; --rn-basalt:#4B4F58; --rn-lupine:#7B6FB0; --rn-snow:#FAFBFC; --rn-pop:#D7263D;
    /* Ararat */ --ar-apricot:#F0A35E; --ar-tuff:#C98B7E; --ar-violet:#5E4B6B; --ar-sand:#E9D3B0; --ar-pop:#B5172F;
    /* Fuji */ --fj-blue:#1F4E79; --fj-ochre:#B5452F; --fj-sakura:#F2C6CF; --fj-washi:#F5EBDC; --fj-pop:#F3B23C;
    /* Everest */ --ev-ice:#F2F6FA; --ev-shadow:#5B6B7E; --ev-rock:#2E3440; --ev-plume:#DDE5EE; --ev-pop:#FF6B1A;
    /* Olympus Mons */ --om-rust:#B5502F; --om-sky:#D9A066; --om-dust:#E7C9A2; --om-basalt:#3B2A26; --om-pop:#5DA9E9;

    --f-display:'Fraunces', 'Iowan Old Style', Georgia, serif;
    --f-label:'Inter Tight', 'Helvetica Neue', Arial, sans-serif;
    --ease-out:cubic-bezier(.22,1,.36,1); --ease-draw:cubic-bezier(.45,.05,.35,1);
    --gutter:clamp(16px,4vw,56px);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]):not(.day){
    --paper:#1E1A20; --ink:#F1E9DC; --muted:#B5AA9C; --floor:#151216; --floor-ink:#F1E9DC;
    --card:#2A2429; --card-ink:#F1E9DC; --card-line:rgba(241,233,220,.18);
    --h-sky1:#191519; --h-sky2:#2E2530; --h-plain:#221D21; --h-plain2:#1C181C; --h-ink:#F1E9DC; --h-muted:#B5AA9C;
    --h-veil-o:.42; --h-mist:#4A4148; --h-star-o:1;
    --mk-sky0:#140F1B; --mk-rock:#130E19; --mk-sea0:#211B32; --mk-sea1:#100C18; --mk-glow-o:.3;
    color-scheme:dark } }
  :root[data-theme="dark"]:not(.day), :root.night{
    --paper:#1E1A20; --ink:#F1E9DC; --muted:#B5AA9C; --floor:#151216; --floor-ink:#F1E9DC;
    --card:#2A2429; --card-ink:#F1E9DC; --card-line:rgba(241,233,220,.18);
    --h-sky1:#191519; --h-sky2:#2E2530; --h-plain:#221D21; --h-plain2:#1C181C; --h-ink:#F1E9DC; --h-muted:#B5AA9C;
    --h-veil-o:.42; --h-mist:#4A4148; --h-star-o:1;
    --mk-sky0:#140F1B; --mk-rock:#130E19; --mk-sea0:#211B32; --mk-sea1:#100C18; --mk-glow-o:.3;
    color-scheme:dark }
  :root.day{color-scheme:light}

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--f-label);-webkit-font-smoothing:antialiased;overflow-x:clip}
  svg{max-width:100%}
  h1,h2{font-family:var(--f-display);font-weight:400;margin:0;line-height:.95;letter-spacing:-.01em;text-wrap:balance;font-variation-settings:"opsz" 144}
  p{margin:0}
  q{quotes:"\201C" "\201D"}
  .sc{font:600 .72em/1 var(--f-label);letter-spacing:.2em;text-transform:uppercase}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ===== Panel grammar shared by every mountain ===== */
  main > section.pn{position:relative;overflow:hidden}
  .pn-head{position:relative;z-index:3;padding-block:clamp(24px,5vh,48px) 14px;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .pn-head h2{font-size:clamp(46px,7.2vw,104px)}
  .pn-mean{margin-top:12px;font:italic 400 clamp(17px,1.6vw,22px)/1.3 var(--f-display);max-width:30ch}
  .pn-hint{margin-top:14px;font:500 11px/1.2 var(--f-label);letter-spacing:.14em;text-transform:uppercase;opacity:.7}
  .pn-scroll{position:relative}
  .scene{position:relative;width:100%;aspect-ratio:16/9;max-width:100%}
  .scene > svg.art{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* Laptop track: the scene fills the panel, the head floats top-left over the sky */
  html.hz-on main > section.pn{display:block !important;padding:0 !important}
  html.hz-on main > section.pn::before, html.hz-on main > section.pn::after{display:none}
  html.hz-on .pn-scroll{position:absolute;inset:0}
  html.hz-on .scene{position:absolute;inset:0;aspect-ratio:auto;height:100%}
  html.hz-on .pn-head{position:absolute;top:0;left:0;max-width:min(48%,620px);padding-left:max(var(--gutter),env(safe-area-inset-left,0px));pointer-events:none}
  html.hz-on .pn-head a, html.hz-on .pn-head button{pointer-events:auto}

  /* Stacked (below 820px, ?final=1, reduced motion): panels read top to bottom; small screens pan the picture */
  html:not(.hz-on) .scene svg.art{position:relative}
  @media (max-width:819px){
    .pn-scroll{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin}
    .pn-scroll .scene{min-width:820px}
    .pn-pan{display:block}
  }
  .pn-pan{display:none;font:500 10.5px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;opacity:.6;
    padding:8px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}

  /* ===== Stops: numbered markers in the scene. Their words are written into the picture, never into a box. ===== */
  .stop{cursor:pointer;outline:none}
  .stop .st-hit{fill:transparent;stroke:none}
  .stop .st-dot{fill:var(--pop)}
  .stop .st-num{font:700 13px var(--f-label);fill:var(--st-num,#1A1420);pointer-events:none}
  .stop .st-lab{font:600 11.5px var(--f-label);letter-spacing:2.4px;fill:var(--ins-ink);paint-order:stroke;stroke:var(--ins-halo);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
  .stop .st-ring{fill:none;stroke:var(--pop);stroke-width:1.6;opacity:0}
  @media (hover:hover){ .stop:hover .st-ring{opacity:1} }
  .stop:focus-visible .st-ring{opacity:1;stroke-dasharray:3 3}
  .stop.on .st-dot{fill:var(--ins-ink)} .stop.on .st-ring{opacity:1}
  .veil{fill:var(--veil,#120D18);opacity:0;pointer-events:none}
  .opened .veil{opacity:.58}
  .opened .lit{visibility:hidden}
  .ins text{fill:var(--ins-ink);paint-order:stroke;stroke:var(--ins-halo);stroke-width:5px;stroke-linejoin:round}
  .ins .i-k{font:600 12.5px var(--f-label);letter-spacing:2.6px;fill:var(--pop)}
  .ins .i-q{font:italic 400 25px var(--f-display)}
  .ins .i-t{font:400 19.5px var(--f-display)}
  .ins tspan.w{visibility:hidden}
  .ins tspan.w.in{visibility:visible}
  .ins{cursor:pointer}

  /* ===== Lamps: fixed lights in the scene. Tap one and it lights; what it shows stays lit. ===== */
  .lamp{cursor:pointer;outline:none}
  .lamp .lp-hit{fill:transparent;stroke:none}
  .lamp .lp-ring{fill:none;stroke:#F2C98A;stroke-width:1.2;stroke-dasharray:2 4;opacity:0}
  html.night .lamp:not(.on) .lp-ring{opacity:.75}
  .lamp:focus-visible .lp-ring{opacity:1;stroke-dasharray:none}
  .lit{display:none}
  html.night .lit.on{display:inline}
  .lit.flick{animation:flick .5s steps(1,end) 1 both}
  @keyframes flick{0%{opacity:0}20%{opacity:1}40%{opacity:.2}60%{opacity:1}76%{opacity:.45}100%{opacity:1}}
  .pool{mix-blend-mode:screen;pointer-events:none}
  .lit .nx-t{font:italic 400 19px var(--f-display);fill:#F7D9A6;paint-order:stroke;stroke:#1A1420;stroke-width:4px;stroke-linejoin:round}
  .lit .nx-k{font:600 11.5px var(--f-label);letter-spacing:2.4px;fill:#F7D9A6;paint-order:stroke;stroke:#1A1420;stroke-width:4px;stroke-linejoin:round}

  /* ===== Panel head: the route through the stops, and the lamp count ===== */
  .route{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:16px;font:600 11px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase}
  .route button{width:30px;height:30px;padding:0;border-radius:50%;border:1px solid currentColor;background:none;color:inherit;cursor:pointer;font:400 17px/1 var(--f-label);display:grid;place-items:center}
  .route button:active{scale:.94}
  .route button:focus-visible{outline:2px solid var(--pop,#F2A541);outline-offset:2px}
  .route .rt-c{font-variant-numeric:tabular-nums}
  .route .rt-l{color:var(--pop,currentColor)}
  .route .rt-lamps{display:flex;align-items:center;gap:6px;margin-left:8px;opacity:.75}
  .route .rt-lamps i{display:inline-block;width:7px;height:10px;border-radius:50% 50% 45% 45%;border:1px solid currentColor}
  .route .rt-lamps i.on{background:#F2A541;border-color:#F2A541}

  /* The lantern: night mode switch */
  .lantern{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 16px);
    display:flex;align-items:center;gap:9px;height:40px;padding:0 14px 0 10px;border-radius:999px;border:1px solid var(--card-line);
    background:var(--card);color:var(--card-ink);cursor:pointer;font:600 10.5px/1 var(--f-label);letter-spacing:.14em;text-transform:uppercase;
    box-shadow:0 6px 18px -10px rgba(0,0,0,.4);transition:scale .12s ease-out}
  .lantern:active{scale:.96}
  .lantern svg{width:18px;height:22px}
  .lantern .ln-flame{fill:#F2A541;opacity:.25}
  html.night .lantern .ln-flame{opacity:1}
  .lantern:focus-visible{outline:2px solid #F2A541;outline-offset:2px}
  @media (max-width:540px){ .lantern .ln-word{display:none} .lantern{padding:0 11px} }

  @media (prefers-reduced-motion: reduce){ *{transition-duration:0s !important;animation:none !important} }
</style>
<script>
  /* ===== Shared helpers ===== */
  const root = document.documentElement;
  root.classList.add('js', 'no-gate');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FINAL = reduce || /[?&]final=1/.test(location.search);
  if (FINAL) root.classList.add('final');
  const NS = 'http://www.w3.org/2000/svg';
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  function onView(el, fn, threshold = .25) {
    if (!el) return;
    if (FINAL || !('IntersectionObserver' in window)) { fn(); return; }
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.disconnect(); fn(); } }), { threshold });
    io.observe(el);
  }
  /* House pen rule: length / speed, clamped .6 to 2.2s, next stroke at 82% of the previous. */
  function penDraw(paths, { delay = 0, speed = 600, overlap = .82, parallel = false, min = .6, max = 2.2 } = {}) {
    let t = delay, end = delay;
    paths.forEach(p => {
      const L = p.getTotalLength ? p.getTotalLength() : 0;
      if (FINAL) { p.style.strokeDasharray = ''; p.style.strokeDashoffset = ''; return; }
      const d = Math.min(max, Math.max(min, L / speed));
      p.style.transition = 'none'; p.style.strokeDasharray = L + ' ' + L; p.style.strokeDashoffset = L;
      p.getBoundingClientRect();
      p.style.transition = `stroke-dashoffset ${d}s var(--ease-draw) ${parallel ? delay : t}s`;
      requestAnimationFrame(() => requestAnimationFrame(() => { p.style.strokeDashoffset = 0; }));
      if (parallel) end = Math.max(end, delay + d * overlap); else { t += d * overlap; end = t; }
    });
    return end;
  }
  /* Hide paths until penDraw runs (so they don't flash finished first). */
  function prepDraw(paths) { if (FINAL) return; paths.forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L + ' ' + L; p.style.strokeDashoffset = L; }); }
  /* Seeded random, so every drawing is the same on every load. */
  function rng(seed = 7) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const f1 = n => Math.round(n * 10) / 10;

  /* ===== Night: the lantern. System dark starts at night; the lantern flips it and is remembered. ===== */
  const sysDark = () => root.dataset.theme === 'dark' || (root.dataset.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  let NIGHT = sysDark();
  try { const s = localStorage.getItem('range-night'); if (s === '1' || s === '0') NIGHT = s === '1'; } catch (e) {}
  function setNight(on, remember) {
    NIGHT = on; root.classList.toggle('night', on); root.classList.toggle('day', !on);
    if (remember) try { localStorage.setItem('range-night', on ? '1' : '0'); } catch (e) {}
    const b = document.querySelector('.lantern'); if (b) { b.setAttribute('aria-pressed', on); const w = b.querySelector('.ln-word'); if (w) w.textContent = on ? 'Night' : 'Day'; }
    document.dispatchEvent(new CustomEvent('range:night', { detail: on }));
  }
  setNight(NIGHT, false);
</script>

<main>
<!-- =====================================================================
  ARCHITECTURE SHELL: HORIZONTAL, "the scroll painting"
  Copy to work/frag-00-arch.html so it loads before every section. Sections stay as they are.

  - Top-level <section>s in <main> sit side by side on one long track, like a pattachitra or phad scroll that
    unrolls. Scrolling down (wheel, trackpad, touch, keys) moves the track sideways, 1px for 1px, linear.
    No snapping, no smooth-scroll library. A sideways trackpad swipe moves it too.
  - Each section is a panel one screen wide; data-span="2" on a section makes it two screens wide
    (lay its content out wide). A panel taller than the screen tries tighter type, a narrower column, then
    head beside visual (data-cps-fit levels below); if nothing fits it scrolls inside itself.
    Section-specific fit rules go in their own fragment (work/frag-00-fit.html, scoped html.hz-on #id);
    --cps-split:no on a section rules out head beside visual.
  - The rail (bottom): a marker per section (tap to go there), the current section's name and "02 / 06".
    ArrowRight / ArrowLeft move one panel.
  - The ground (optional): one SVG strip under the panels, the length of the whole track, for a road, a river
    or a thread. It never sits behind text. Define it in any fragment before the page finishes loading:
      window.CPS_GROUND = ({ W, H, x, y, panels }) => `<path class="hz-guide" d="..."/><path class="hz-draw" d="..."/>`;
    x(u) maps panel units (each panel is 100 wide) to px, y(v) maps 0..100 to px; W and H are the strip in px.
    Paths with class hz-draw pen-draw with progress (stroke-dashoffset); hz-guide is the faint construction
    line; anything with data-x="<panel units>" lights once the drawn line reaches it.
  - Events, dispatched on the section and bubbling: cps:enter / cps:leave {index, total, dir} as a panel
    becomes the one under the middle of the screen. onView and .rv work: IntersectionObserver sees the
    panels' real sideways positions, so a panel's drawings start when it slides in.
  - window.CPS = {arch, go(n), index()}  (n is 0-based)
  - FINAL (?final=1 or reduced motion), narrower than 820px, or the phone gate: an ordinary vertical page.
  ===================================================================== -->
<style>
  html.arch-horizontal{--hz-floor:var(--floor);--hz-rail:40px;--hz-lane:0px}
  html.hz-on.hz-has-ground{--hz-lane:clamp(46px,7vh,62px)}

  /* ---- The track: main sticks to the screen and slides sideways; body gets the scroll length ---- */
  html.hz-on body{background:var(--hz-floor)}
  html.hz-on main{position:sticky;top:0;height:100vh;height:100svh;display:flex;flex-wrap:nowrap;align-items:flex-start;
    width:max-content;background:var(--hz-floor);will-change:transform}
  html.hz-on main > section{flex:0 0 auto;position:relative;
    width:calc(var(--hz-w,100vw) * var(--hz-span,1)) !important;max-width:none !important;
    height:calc(100% - var(--hz-lane) - var(--hz-rail)) !important;min-height:0 !important;max-height:none !important;margin:0 !important;
    overflow-x:hidden !important;overflow-y:auto !important;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.28) transparent;
    display:flex;flex-direction:column}
  :where(html.hz-on main > section){background-color:var(--paper)}
  html.hz-on main > section > *{flex-shrink:0}
  html.hz-on main > section > .wrap{width:100%}
  html.hz-on main > section::before,html.hz-on main > section::after{content:"";flex:1 0 0px}
  html.hz-on main > section.band{padding-top:clamp(32px,6vh,60px) !important;padding-bottom:clamp(32px,6vh,60px) !important}
  html.hz-on main > section .band-head{margin-bottom:clamp(22px,3.6vh,40px)}
  /* the phone gate wins over the track */
  @media (max-width:539px),(pointer:coarse) and (max-height:499px){html.arch-horizontal:not(.no-gate) main{display:none}}
  html.arch-horizontal.phone main{display:none}

  /* ---- Fit levels, set only on panels that overflow (first that fits wins) ----
     1 tighter type and spacing · 2 plus a 1000px column · 3 head beside visual · 4 that, tighter
     5 an 860px column · 6 a 760px column */
  html.hz-on main > section[data-cps-fit].band{padding-top:clamp(22px,4vh,40px) !important;padding-bottom:clamp(22px,4vh,40px) !important}
  html.hz-on main > section[data-cps-fit] h2{font-size:clamp(30px,3.3vw,46px)}
  html.hz-on main > section[data-cps-fit] .lede{font-size:17px}
  html.hz-on main > section[data-cps-fit] .band-head{gap:12px;margin-bottom:clamp(14px,2.6vh,28px)}
  html.hz-on main > section[data-cps-fit="2"]{--wrap:1000px}
  html.hz-on main > section[data-cps-fit="4"].band{padding-top:clamp(14px,2.4vh,24px) !important;padding-bottom:clamp(14px,2.4vh,24px) !important}
  html.hz-on main > section[data-cps-fit="4"] h2{font-size:clamp(28px,2.8vw,40px)}
  html.hz-on main > section[data-cps-fit="4"] h3{font-size:clamp(20px,1.8vw,24px)}
  html.hz-on main > section[data-cps-fit="5"]{--wrap:860px}
  html.hz-on main > section[data-cps-fit="6"]{--wrap:760px}
  html.hz-on main > section .wrap.cps-split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);column-gap:clamp(28px,4vw,64px);align-items:center}
  html.hz-on main > section .wrap.cps-split > *{margin-top:0 !important;margin-bottom:0 !important;min-width:0}

  /* ---- The ground: a strip under the panels, on the track, so it never crosses text ---- */
  .hz-ground{display:none}
  html.hz-on.hz-has-ground .hz-ground{display:block;position:absolute;left:0;bottom:var(--hz-rail);width:100%;height:var(--hz-lane);pointer-events:none}
  .hz-ground svg{display:block;max-width:none;overflow:visible}
  .hz-ground .hz-guide{fill:none;stroke:var(--floor-ink);stroke-width:1;stroke-dasharray:3 5;opacity:.3}
  .hz-ground .hz-draw{fill:none;stroke:var(--floor-ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .hz-ground [data-x]{opacity:0;transition:opacity .6s var(--ease-out)}
  .hz-ground [data-x].hz-lit{opacity:1}

  /* ---- The rail ---- */
  .hz-rail{display:none}
  html.hz-on .hz-rail{position:fixed;left:0;right:0;bottom:0;z-index:40;height:var(--hz-rail);display:flex;align-items:center;
    gap:clamp(18px,2.6vw,36px);padding:0 max(var(--gutter),22px);background:var(--hz-floor);color:var(--floor-ink)}
  .hz-now{margin:0;display:flex;align-items:baseline;gap:14px;min-width:0;flex:0 1 36%;
    font:500 11.5px/1.2 var(--font-label);letter-spacing:.08em;text-transform:uppercase}
  .hz-count{font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
  .hz-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.68}
  .hz-line{position:relative;flex:1 1 auto;height:2px;margin:0 14px;background:rgba(255,255,255,.2)}
  .hz-fill{position:absolute;inset:0;background:var(--floor-ink);transform-origin:0 50%;transform:scaleX(0)}
  .hz-mark{position:absolute;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;padding:0;border:0;background:none;cursor:pointer;
    display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
  .hz-mark i{width:9px;height:9px;border-radius:50%;background:var(--hz-floor);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6);
    transition:background-color .3s var(--ease-out),scale .3s var(--ease-out)}
  .hz-mark.done i{background:var(--paper);box-shadow:none}
  .hz-mark.now i{background:var(--paper);box-shadow:none;scale:1.45}
  .hz-mark:focus-visible{outline:2px solid var(--paper);outline-offset:-4px;border-radius:50%}
  .hz-mark.hz-sil{width:34px;height:24px;margin:-12px 0 0 -17px;border-radius:4px}
  .hz-mark.hz-sil svg{width:28px;height:16px;opacity:.55;transition:opacity .3s var(--ease-out),scale .3s var(--ease-out);transform-origin:50% 100%}
  .hz-mark.hz-sil.done svg{opacity:.8}
  .hz-mark.hz-sil.now svg{opacity:1;scale:1.3}
  .hz-mark.hz-sil:focus-visible{border-radius:4px}
</style>

<div class="hz-ground" aria-hidden="true">
  <svg class="hz-ground-svg" viewBox="0 0 100 100"><g class="hz-ground-art"></g></svg>
</div>
<div class="hz-rail">
  <p class="hz-now" aria-live="polite"><b class="hz-count">01 / 01</b><span class="hz-name"></span></p>
  <div class="hz-line"><i class="hz-fill"></i></div>
</div>

<script>
(() => {
  const root = document.documentElement;
  const GATE = '(max-width:539px), (pointer:coarse) and (max-height:499px)';
  const wide = () => !FINAL && innerWidth >= 820 && !matchMedia(GATE).matches && !root.classList.contains('phone');
  root.classList.add('arch-horizontal');
  root.classList.toggle('hz-on', wide());

  /* Reveal: panels arrive from the right, so a block reveals once it is 8% of the screen in.
     The starter's bottom margin is dropped to 6%, so blocks low on a panel still reveal. */
  if (!FINAL && typeof initReveal === 'function') {
    removeEventListener('DOMContentLoaded', initReveal);
    addEventListener('DOMContentLoaded', () => {
      const els = $$('.rv');
      if (!('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
      const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px -8% -6% 0px' });
      els.forEach(e => io.observe(e));
    });
  }

  addEventListener('DOMContentLoaded', () => {
    const main = $('main');
    const panels = main ? $$(':scope > section', main) : [], N = panels.length;
    const rail = $('.hz-rail'), ground = $('.hz-ground');
    if (!N || !rail || !ground) return;
    const art = $('.hz-ground-art', ground), gsvg = $('svg', ground);
    const line = $('.hz-line', rail), fill = $('.hz-fill', rail), countEl = $('.hz-count', rail), nameEl = $('.hz-name', rail);
    const spacer = document.createElement('div');
    spacer.className = 'hz-spacer'; spacer.setAttribute('aria-hidden', 'true');
    main.after(spacer);
    document.body.appendChild(rail);   /* out of the moving track, so position:fixed holds */
    const ev = (el, name, detail) => el.dispatchEvent(new CustomEvent(name, { bubbles: true, detail }));
    const titleOf = s => (s.dataset.title || ($('h2', s) || $('h1', s) || {}).textContent || s.getAttribute('aria-label') || '').replace(/\s+/g, ' ').trim();
    const pad = n => String(n).padStart(2, '0');
    let on = false, VW = 0, W = 0, D = 0, start = 0, x = 0, cur = -1, spans = [], lefts = [], marks = [], gp = [], pins = [];

    /* ---- Fit (same ladder as the paged shell) ---- */
    const SPLIT = [3, 4];
    const kids = w => w ? [...w.children].filter(k => !/^(STYLE|SCRIPT|TEMPLATE)$/.test(k.tagName) && getComputedStyle(k).position !== 'absolute') : [];
    /* head beside visual is skipped when the visual places HTML text by % (it would wrap and collide),
       or when a fit rule sets --cps-split: no on the section */
    const splitOk = (s, vis) => getComputedStyle(s).getPropertyValue('--cps-split').trim() !== 'no' &&
      ![...vis.querySelectorAll('*')].some(n => !(n instanceof SVGElement) && getComputedStyle(n).position === 'absolute' && n.textContent.trim().length > 12);
    const unfit = s => { delete s.dataset.cpsFit; const w = s.querySelector(':scope > .wrap'); if (w) w.classList.remove('cps-split'); };
    function fitAll() {
      panels.forEach(unfit);
      if (!on) return;
      panels.forEach(s => {
        const w = s.querySelector(':scope > .wrap'), k = kids(w), canSplit = s.clientWidth / s.clientHeight > 1.15 && k.length === 2 && splitOk(s, k[1]);
        const set = lv => { if (lv) s.dataset.cpsFit = lv; else delete s.dataset.cpsFit; if (w) w.classList.toggle('cps-split', SPLIT.includes(lv)); };
        const fits = () => s.scrollHeight - s.clientHeight <= 2;
        if (fits()) return;
        for (const lv of [1, 2, 3, 4, 5, 6]) { if (SPLIT.includes(lv) && !canSplit) continue; set(lv); if (fits()) return; }
        set(0);
      });
    }

    /* ---- The ground strip ---- */
    function buildGround() {
      gp = []; pins = []; art.innerHTML = '';
      if (!on || typeof window.CPS_GROUND !== 'function') return;
      const H = ground.clientHeight || 1, u = VW / 100, r = v => Math.round(v * 10) / 10;
      gsvg.setAttribute('viewBox', `0 0 ${W} ${H}`); gsvg.setAttribute('width', W); gsvg.setAttribute('height', H);
      try {
        art.innerHTML = window.CPS_GROUND({ W, H, x: v => r(v * u), y: v => r(v * H / 100),
          panels: panels.map((p, i) => ({ id: p.id, title: titleOf(p), left: lefts[i] / u, span: spans[i] })) }) || '';
      } catch (err) { console.warn('CPS_GROUND:', err); art.innerHTML = ''; }
      gp = $$('.hz-draw', art).map(p => {
        const L = p.getTotalLength(), n = 200, xs = [];
        for (let k = 0; k <= n; k++) xs.push(p.getPointAtLength(L * k / n).x);
        p.style.strokeDasharray = `${L} ${L}`; p.style.strokeDashoffset = L;
        return { p, L, xs, n };
      });
      pins = $$('[data-x]', art).map(el => ({ el, x: +el.getAttribute('data-x') * u, lit: false }));
    }
    /* draw every hz-draw path up to the head (the point the reader has reached, in px along the track) */
    function drawGround(head) {
      gp.forEach(g => {
        let f = 0;
        if (g.xs[0] <= head) {
          let k = 0; while (k < g.n && g.xs[k + 1] <= head) k++;
          f = k / g.n;
          if (k < g.n) { const a = g.xs[k], b = g.xs[k + 1]; if (b > a) f += Math.min(1, (head - a) / (b - a)) / g.n; }
        }
        g.p.style.strokeDashoffset = (g.L * (1 - f)).toFixed(1);
      });
      pins.forEach(pn => { if (!pn.lit && pn.x <= head) { pn.lit = true; pn.el.classList.add('hz-lit'); } });
    }

    /* ---- The rail ---- */
    function buildRail() {
      marks.forEach(m => m.remove());
      marks = panels.map((p, i) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'hz-mark' + (p.dataset.sil ? ' hz-sil' : ''); b.title = titleOf(p);
        b.innerHTML = p.dataset.sil ? `<svg viewBox="0 0 28 16" aria-hidden="true"><path d="${p.dataset.sil}" style="fill:${p.dataset.pop}"/></svg>` : '<i></i>';
        b.style.left = (D ? Math.min(D, lefts[i]) / D * 100 : 0) + '%';
        b.setAttribute('aria-label', `Go to ${i + 1} of ${N}: ${titleOf(p)}`);
        b.addEventListener('click', () => go(i));
        line.appendChild(b); return b;
      });
    }
    function label(i) {
      countEl.textContent = `${pad(i + 1)} / ${pad(N)}`; nameEl.textContent = titleOf(panels[i]);
      marks.forEach((m, k) => { m.classList.toggle('done', k < i); m.classList.toggle('now', k === i); });
    }

    /* ---- Layout: measure once per resize, never per frame ---- */
    function layout() {
      const was = on, keep = cur;
      on = wide();
      root.classList.toggle('hz-on', on);
      root.classList.toggle('hz-has-ground', on && typeof window.CPS_GROUND === 'function');
      if (!on) {
        main.style.transform = ''; main.style.width = ''; spacer.style.height = '0px';
        fitAll(); buildGround();
        if (was && keep >= 0) panels[keep].scrollIntoView({ block: 'start' });
        update(); return;
      }
      VW = root.clientWidth;
      root.style.setProperty('--hz-w', VW + 'px');
      spans = panels.map(p => Math.max(1, Math.min(4, Math.round(+p.dataset.span || 1))));
      panels.forEach((p, i) => p.style.setProperty('--hz-span', spans[i]));
      lefts = []; let acc = 0; spans.forEach(s => { lefts.push(acc); acc += s * VW; });
      W = acc; D = Math.max(0, W - VW);
      main.style.width = W + 'px';
      spacer.style.height = D + 'px';
      start = spacer.getBoundingClientRect().top + scrollY - main.offsetHeight;
      fitAll(); buildRail(); buildGround();
      if (!was && keep >= 0) scrollTo(0, start + Math.min(D, lefts[keep]));
      if (cur >= 0) label(cur);
      update();
    }

    /* ---- Every scroll frame: one transform, the rail fill, the ground line ---- */
    function update() {
      /* the browser scrolled sideways itself (find in page, focus): carry that onto the track */
      if (scrollX) scrollTo(0, on ? scrollY + scrollX : scrollY);
      let i = 0;
      if (on) {
        x = Math.min(D, Math.max(0, scrollY - start));
        main.style.transform = `translate3d(${-x}px,0,0)`;
        const p = D ? x / D : 0;
        fill.style.transform = `scaleX(${p})`;
        const c = x + VW / 2; while (i < N - 1 && lefts[i + 1] <= c) i++;
        const head = x + VW * (.14 + .86 * p);   /* the climber walks at 14% of the screen and reaches the end with the track */
        drawGround(head); if (window.CPS_HEAD) window.CPS_HEAD(head);
      } else {
        const mid = innerHeight / 2;
        panels.forEach((p, k) => { if (p.getBoundingClientRect().top <= mid) i = k; });
      }
      if (i !== cur) {
        const dir = i > cur ? 1 : -1;
        if (cur >= 0) ev(panels[cur], 'cps:leave', { index: cur, total: N, dir });
        cur = i; if (on) label(i);
        ev(panels[i], 'cps:enter', { index: i, total: N, dir });
      }
    }
    function go(i) {
      i = Math.max(0, Math.min(N - 1, i));
      if (on) scrollTo({ top: start + Math.min(D, lefts[i]), behavior: 'smooth' });
      else panels[i].scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    let raf = 0, rt = 0;
    addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; update(); }); }, { passive: true });
    addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 150); });
    addEventListener('keydown', e => {
      if (!on || e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]:not([contenteditable="false"])')) return;
      e.preventDefault();
      let t = -1;
      if (e.key === 'ArrowRight') { t = lefts.findIndex(l => l > x + 4); if (t < 0) t = N - 1; }
      else { lefts.forEach((l, k) => { if (l < x - 4) t = k; }); if (t < 0) t = 0; }
      go(t);
    });
    /* a sideways trackpad swipe moves the track the same way */
    addEventListener('wheel', e => {
      if (!on || Math.abs(e.deltaX) <= Math.abs(e.deltaY) || Math.abs(e.deltaX) < 1) return;
      e.preventDefault(); scrollBy(0, e.deltaX * (e.deltaMode === 1 ? 40 : 1));
    }, { passive: false });
    /* Tab into a panel that is off screen: bring the panel in */
    document.addEventListener('focusin', e => {
      if (!on) return;
      const i = panels.findIndex(p => p.contains(e.target)); if (i < 0) return;
      const l = lefts[i], r = l + spans[i] * VW;
      if (r <= x + 1 || l >= x + VW - 1) scrollTo(0, start + Math.min(D, l));
    });

    layout();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (on) { fitAll(); update(); } });
    addEventListener('load', () => { if (on) { fitAll(); update(); } });
    window.CPS = { arch: 'horizontal', go, index: () => cur };
  });
})();
</script>

<style>
  /* ===== The trail lane: the climber and the mountain markers ===== */
  .hz-ground .trail-dots{fill:var(--floor-ink);opacity:.22}
  .hz-ground .lane-m{transition:opacity .6s var(--ease-out)}
  .hz-ground .lane-m path{opacity:.95}
  .hz-ground .lane-t{font:600 9px/1 var(--f-label);letter-spacing:.18em;text-transform:uppercase;fill:var(--floor-ink);opacity:.55}
  .hz-ground .climber{transition:none}
  .hz-ground .climber .cl-ink{fill:none;stroke:var(--floor-ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .hz-ground .climber .cl-fill{fill:var(--floor-ink)}
  .hz-ground .climber .cl-hat{fill:#E3A21A}

  .hz-ground .climber.step .leg-a{display:none}
  .hz-ground .climber.step .leg-b{display:inline}

<script>
(() => {
  /* ===== Silhouettes: one per stop on the trail, used by the rail and the lane ===== */
  const SIL = {
    range:'M0 16L5 10 8 12 13 4 17 9 20 7 28 16Z',
    mk:'M1 16C5 11 8 9 11 9h1c0-1.4 2-1.4 2 0h1c3 0 7 2 12 7Z',
    my:'M3 16C8 12 12 6 14 2c2 4 6 10 11 14Z',
    kz:'M2 16L8 9 10 10 14 2 17 7 19 6 26 16Z',
    va:'M0 16L4 7 9 13 14 11 19 13 24 7 28 16Z',
    rn:'M1 16C6 11 9 5 13 3c2 0 3 0 4 1 3 3 6 8 10 12Z',
    ar:'M1 16C5 11 8 5 10 3c1 0 2 1 3 3l3 5 3-3c1-1 2 0 3 1l5 7Z',
    fj:'M2 16C7 13 10 8 12 3h4c2 5 5 10 10 13Z',
    ev:'M1 16L7 9 10 8 14 1 17 5 19 4 27 16Z',
    om:'M0 16C6 12 9 10 12 10h4c3 0 6 2 12 6Z'
  };
  window.RANGE_SIL = SIL;

  /* ===== Words written into the scene: one word at a time, each word whole ===== */
  const LEAD = { k: 0, q: 33, t: 29 };
  function write(g, ins, { now = false, delay = 0 } = {}) {
    g.innerHTML = '';
    const words = [], timers = [];
    let y = ins.y;
    ins.lines.forEach(([cls, line], i) => {
      if (i) y += LEAD[cls] || 30;
      if (i && ins.lines[i - 1][0] === 'k') y += 4;
      const tx = document.createElementNS(NS, 'text');
      tx.setAttribute('x', ins.x); tx.setAttribute('y', y); tx.setAttribute('class', 'i-' + cls);
      tx.setAttribute('text-anchor', ins.anchor || 'start');
      line.split(' ').forEach((w, j) => { const s = document.createElementNS(NS, 'tspan'); s.textContent = (j ? ' ' : '') + w; s.setAttribute('class', 'w'); tx.appendChild(s); words.push(s); });
      g.appendChild(tx);
    });
    if (now || FINAL) words.forEach(s => s.classList.add('in'));
    else words.forEach((s, i) => timers.push(setTimeout(() => s.classList.add('in'), delay + i * 42)));
    return { cancel() { timers.forEach(clearTimeout); } };
  }
  const plain = ins => ins.lines.map(l => l[1]).join(' ');

  /* ===== Stops: numbered, in story order. Opening one dims the scene around it (attention is a flashlight),
     the object does its own small act, then its words are written beside it. ===== */
  const panels = [];
  function initPanel(sec, stops) {
    const scene = $('.scene', sec), svg = $('svg.art', scene), id = sec.id;
    const P = { sec, svg, scene, stops, open: -1, w: null };
    panels.push(P);
    svg.insertAdjacentHTML('beforeend',
      `<defs><radialGradient id="${id}-vg"><stop offset=".55" stop-color="#000"/><stop offset="1" stop-color="#fff"/></radialGradient>
       <mask id="${id}-vm" maskUnits="userSpaceOnUse" x="-400" y="-400" width="2400" height="2800"><rect x="-400" y="-400" width="2400" height="2800" fill="#fff"/><ellipse class="vm-h" fill="url(#${id}-vg)"/></mask></defs>
       <rect class="veil" x="-400" y="-400" width="2400" height="2800" mask="url(#${id}-vm)"/><g class="stops"></g><g class="ins"></g>`);
    P.ins = $('g.ins', svg); P.hole = $('.vm-h', svg);
    const sg = $('g.stops', svg);
    stops.forEach((s, i) => {
      const [bx, by] = s.at, side = s.side || 'r';
      const lx = side === 'l' ? bx - 20 : side === 'b' ? bx : bx + 20, ly = side === 'b' ? by + 30 : by + 4.2, la = side === 'l' ? 'end' : side === 'b' ? 'middle' : 'start';
      const [hx, hy, hr] = s.hit || [bx, by, 0];
      sg.insertAdjacentHTML('beforeend', `<g class="stop" data-i="${i}" tabindex="0" role="button" aria-label="${i + 1}. ${s.name || s.label}">
        ${hr ? `<circle class="st-hit" cx="${hx}" cy="${hy}" r="${hr}"/>` : ''}<circle class="st-hit" cx="${bx}" cy="${by}" r="20"/>
        <circle class="st-ring" cx="${bx}" cy="${by}" r="17.5"/><circle class="st-dot" cx="${bx}" cy="${by}" r="12"/>
        <text class="st-num" x="${bx}" y="${by + 4.6}" text-anchor="middle">${i + 1}</text>
        <text class="st-lab" x="${lx}" y="${ly}" text-anchor="${la}">${s.label}</text></g>`);
    });
    P.els = $$('.stop', sg);
    P.els.forEach((g, i) => {
      g.addEventListener('click', e => { e.stopPropagation(); P.open === i ? close(P) : open(P, i); });
      g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); P.open === i ? close(P) : open(P, i); } });
    });
    P.ins.addEventListener('click', e => { e.stopPropagation(); close(P); });
    svg.addEventListener('click', e => { if (P.open >= 0 && !P.stops[P.open].sticky && !e.target.closest('.stop,.lamp')) close(P); });

    /* the route control, in the panel head */
    const head = $('.pn-head', sec), live = document.createElement('p');
    live.className = 'sr'; live.setAttribute('aria-live', 'polite');
    const rt = document.createElement('div');
    rt.className = 'route'; rt.setAttribute('role', 'group'); rt.setAttribute('aria-label', 'The route through this mountain');
    rt.innerHTML = `<button type="button" class="rt-p" aria-label="Previous stop">‹</button><span class="rt-c"></span><button type="button" class="rt-n" aria-label="Next stop">›</button><span class="rt-l"></span><span class="rt-lamps"></span>`;
    head.appendChild(rt); head.appendChild(live);
    P.rt = rt; P.live = live;
    $('.rt-n', rt).addEventListener('click', () => step(P, 1));
    $('.rt-p', rt).addEventListener('click', () => step(P, -1));
    route(P);
    initLamps(sec, $('.rt-lamps', rt));
    return P;
  }
  function route(P, sub) {
    const n = P.stops.length, i = P.open;
    $('.rt-c', P.rt).textContent = i < 0 ? `${n} stops` : `${i + 1} / ${n}`;
    $('.rt-l', P.rt).textContent = i < 0 ? 'Start the route' : sub || P.stops[i].label;
  }
  function step(P, d) {
    const i = P.open, s = i >= 0 && P.stops[i];
    if (s && s.next && s.next(d)) return;           /* a stop with inner steps (the dive) moves first */
    const j = i < 0 ? (d > 0 ? 0 : P.stops.length - 1) : i + d;
    if (j < 0 || j >= P.stops.length) close(P); else open(P, j);
  }
  function open(P, i) {
    panels.forEach(q => q !== P && close(q));
    if (P.open >= 0) close(P, false, true);
    const s = P.stops[i]; P.open = i;
    P.els[i].classList.add('on');
    if (!s.noVeil) {
      const [cx, cy, rx, ry] = s.spot || [s.at[0], s.at[1], 160, 120];
      ['cx', 'cy', 'rx', 'ry'].forEach((k, j) => P.hole.setAttribute(k, [cx, cy, rx, ry][j]));
      P.sec.classList.add('opened');
    }
    P.sec.dataset.stop = s.id;
    const wait = s.act ? s.act(true) : 0;
    if (s.ins) { P.w = write(P.ins, s.ins, { delay: FINAL ? 0 : (wait ?? 300) }); P.live.textContent = plain(s.ins); }
    route(P);
    /* small screens: pan the picture so the words are in view */
    const sc = $('.pn-scroll', P.sec);
    if (s.ins && sc && sc.scrollWidth > sc.clientWidth + 2) {
      const vb = P.svg.viewBox.baseVal, k = P.svg.clientWidth / vb.width, fx = (s.ins.anchor === 'end' ? s.ins.x - 200 : s.ins.anchor === 'middle' ? s.ins.x : s.ins.x + 200);
      sc.scrollTo({ left: Math.max(0, fx * k - sc.clientWidth / 2), behavior: FINAL ? 'auto' : 'smooth' });

    if (P.open < 0) return;

  }, { passive: true });

  /* ===== Lamps: tap one and it lights. By day, a tap brings the night and lights it. ===== */
  function initLamps(sec, tally) {

    const paint = () => { if (!tally) return; const on = lamps.filter(l => l.classList.contains('on')).length;

    const light = (l, on) => {
      l.classList.toggle('on', on); l.setAttribute('aria-pressed', on);

  window.CPS_GROUND = ({ W, H, x, y, panels }) => {
    const total = panels.reduce((a, p) => a + p.span * 100, 0);
    const centres = panels.filter(p => p.id && p.id !== 'range').map(p => ({ id: p.id, c: p.left + p.span * 50 }));

    let d = '';
    for (let u = 2; u <= total - 1; u += 1.5) d += (d ? 'L' : 'M') + x(u) + ' ' + y(v(u));

    const climber = `<g class="climber" transform="translate(${x(14)},${y(v(14))})">
      <path class="cl-fill" d="M-5.5 -15.5h4.6v7.6h-4.6z" opacity=".55"/>

      <circle class="cl-fill" cx="-.9" cy="-19.6" r="2.6"/><path class="cl-hat" d="M-3.8 -20.4c.2-2.6 1.6-3.8 3-3.8s2.8 1.2 2.9 3.8z"/>
      <path class="cl-ink" d="M-.4 -14.4l4.2 3.4M3.8 -11l1.6 11"/>
      <path class="cl-ink leg-a" d="M.6 -8.2L-2.4 0M.6 -8.2L3 -.2"/>
      <path class="cl-ink leg-b" d="M.6 -8.2L-.6 0M.6 -8.2L1.6 -4.4 .8 0"/></g>`;
    return `<g class="trail-dots">${dots}</g><path class="hz-guide" d="${d}"/><path class="hz-draw trail" d="${d}"/>` +
      `<text class="lane-t" x="${x(2.2)}" y="${y(v(2)) - 9}">Trailhead</text>${marks}${climber}`;
  };
  let tr = null, samp = [];
  window.CPS_HEAD = head => {
    const t = $('.hz-ground .trail'), c = $('.hz-ground .climber'); if (!t || !c) return;
    if (t !== tr) { tr = t; samp = []; const L = t.getTotalLength(); for (let k = 0; k <= 400; k++) { const p = t.getPointAtLength(L * k / 400); samp.push([p.x, p.y]); } }
    let lo = 0, hi = samp.length - 1;
    if (head <= samp[0][0]) hi = 0; else if (head >= samp[hi][0]) lo = hi;
    else { while (hi - lo > 1) { const m = (lo + hi) >> 1; if (samp[m][0] < head) lo = m; else hi = m; } }

    c.setAttribute('transform', `translate(${f1(a[0] + (b[0] - a[0]) * k)},${f1(a[1] + (b[1] - a[1]) * k)})`);
    c.classList.toggle('step', Math.floor(head / 11) % 2 === 1);

    centre(); addEventListener('load', centre);
  });

  window.Range = { initPanel, initLamps, open, close, write };
})();

          <g data-for="kz"><path d="M652 392V454"/><text x="652" y="372">KAZBEK</text><text class="hr-h" x="652" y="386">5,054 M</text></g>
          <g data-for="rn"><path d="M864 306V342"/><text x="864" y="286">RAINIER</text><text class="hr-h" x="864" y="300">4,392 M</text></g>
          <g data-for="ar"><path d="M1080 302V352"/><text x="1080" y="282">ARARAT</text><text class="hr-h" x="1080" y="296">5,137 M</text></g>
          <g data-for="fj"><path d="M1300 352V406"/><text x="1300" y="332">FUJI</text><text class="hr-h" x="1300" y="346">3,776 M</text></g>
          <g data-for="ev"><path d="M1450 150V182"/><text x="1450" y="130">EVEREST</text><text class="hr-h" x="1450" y="144">8,849 M</text></g>
          <g data-for="om"><text x="1200" y="206">OLYMPUS MONS</text><text class="hr-h" x="1200" y="220">21.9 KM · ON MARS</text></g>

        <!-- the route that lights when you point at a mountain, and the plate that writes itself -->
        <path class="hr-route" d=""/>

          <circle class="pool" cx="1200" cy="150" r="64" fill="url(#hr-lamp)" style="opacity:.5"/>
          <text class="nx-t" x="1250" y="112">On Mars. Its sunsets are blue.</text>

          <text class="nx-t" x="1366" y="712" text-anchor="middle">Not climbed yet.</text>

          <circle class="pool" cx="790" cy="804" r="80" fill="url(#hr-lamp)" style="opacity:.75"/>
          <text class="nx-t" x="790" y="776" text-anchor="middle">Every trail runs through here.</text>
        </g>
        <g class="lit" data-lamp="hut">
          <circle class="pool" cx="847" cy="410" r="50" fill="url(#hr-lamp)" style="opacity:.75"/>
          <text class="nx-t" x="826" y="440" text-anchor="end">Shasta caps the summit.</text>
        </g>
        <g class="lamp" data-lamp="scope" data-name="the telescope on Mauna Kea"><circle class="lp-ring" cx="229" cy="578" r="14"/><circle class="lp-hit" cx="229" cy="578" r="14"/></g>
        <g class="lamp" data-lamp="hut" data-name="the hut on Rainier"><circle class="lp-ring" cx="847" cy="410" r="13"/><circle class="lp-hit" cx="847" cy="410" r="13"/></g>
        <g class="lamp" data-lamp="beacon" data-name="the beacon in the valley"><circle class="lp-ring" cx="790" cy="804" r="20"/><circle class="lp-hit" cx="790" cy="804" r="9"/></g>
        <g class="lamp" data-lamp="camp" data-name="Everest base camp"><circle class="lp-ring" cx="1366" cy="748" r="14"/><circle class="lp-hit" cx="1366" cy="748" r="14"/></g>
      </svg>
    </div>
  </div>
</section>

<style>
  #range{background:var(--h-sky1);color:var(--h-ink);--pop:var(--va-pop);--ins-ink:var(--h-ink);--ins-halo:var(--h-sky1)}
  .hr-title{font-size:clamp(60px,9vw,132px);font-weight:300;letter-spacing:-.025em}
  .hr-line{max-width:44ch;color:var(--h-ink)}
  .hr-hint{color:var(--h-muted);opacity:1}
  .hr-scene .hm{cursor:pointer;outline:none}
  .hr-scene .hm-hit{fill:transparent;stroke:none}
  .hr-labels text{font:600 12.5px var(--f-label);letter-spacing:2.6px;fill:var(--h-ink);opacity:.78;text-anchor:middle}
  .hr-labels .hr-h{font:500 10px var(--f-label);letter-spacing:1.6px;fill:var(--h-muted);opacity:1}
  .hr-labels path{fill:none;stroke:var(--h-ink);stroke-width:.7;opacity:.4}

  /* Pointing at a mountain: at once, no fade. It steps forward, the rest fall back, its trail lights, its plate writes itself. */
  .hr-scene.focus .hm:not(.on), .hr-scene.focus :is(.hr-rivers,.hr-trails,.hr-flags,.hr-valley,.hr-knot,.hr-labels){opacity:.28}
  .hr-scene.focus .hr-labels{opacity:0}
  .hr-route{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:.1 7;pointer-events:none}
  .hr-plate .pl-n{font:400 42px var(--f-display);letter-spacing:-.01em;fill:var(--h-ink);paint-order:stroke;stroke:var(--h-sky1);stroke-width:7px;stroke-linejoin:round}
  .hr-plate .pl-a{font:700 12.5px var(--f-label);letter-spacing:2.8px;paint-order:stroke;stroke:var(--h-sky1);stroke-width:5px}
  .hr-plate .pl-g{font:600 10px var(--f-label);letter-spacing:2px;fill:var(--h-muted);paint-order:stroke;stroke:var(--h-sky1);stroke-width:5px}
  .hr-plate .ins .i-q{font-size:21px}
  .hr-scene .hm:focus-visible > path:not(.hm-hit):first-of-type{stroke:var(--h-ink);stroke-width:2}

  /* Draw-on: sky, far, back range, front range, then the lines, then the flags. Done inside 3.5s. */
  .js #range:not(.go) :is(.hr-far,.hr-back,.hr-front,.hr-flags,.hr-labels,.hr-knot,.hr-valley){opacity:0;transform:translateY(10px)}
  #range:not(.ready) :is(.hr-far,.hr-back,.hr-front,.hr-flags,.hr-labels,.hr-knot,.hr-valley){transition:opacity .9s var(--ease-out),transform .9s var(--ease-out)}
  #range .hr-far{transition-delay:.1s} #range .hr-back{transition-delay:.55s} #range .hr-front{transition-delay:1s}
  #range .hr-knot, #range .hr-valley{transition-delay:2.2s} #range .hr-flags{transition-delay:2.5s} #range .hr-labels{transition-delay:2.6s}
  #range.ready *{transition:none !important}
  html:not(.hz-on) .hr-head{padding-bottom:6px}
</style>
<script>
(() => {
  const sec = $('#range'), scene = $('.hr-scene', sec), svg = $('svg.art', scene), plate = $('.hr-plate', svg), route = $('.hr-route', svg);
  const M = {
    mk: { name: 'Mauna Kea', ash: 'Stars', mean: 'Awareness. The choice before every choice.', pop: '--mk-pop', to: 'mauna-kea', pl: [236, 392, 'middle'],
      path: 'M790 804C690 800 560 806 430 790S290 760 250 742L226 700 252 660 228 620 240 586' },
    my: { name: 'Mayon', ash: 'Callisto', mean: 'Interface. The world meets me, and I meet it.', pop: '--my-pop', to: 'mayon', pl: [442, 330, 'middle'],
      path: 'M790 804C720 800 620 790 560 774S480 752 470 742L452 680 470 620 446 560 442 522' },
    kz: { name: 'Kazbek', ash: 'Sentinel', mean: 'Change. Learning is moving from A to B.', pop: '--kz-pop', to: 'kazbek', pl: [652, 296, 'middle'],
      path: 'M790 804C760 790 730 770 712 744L676 700 700 640 664 580 660 520 652 486' },
    va: { name: 'The Valley', ash: 'Where every trail meets', mean: 'Engineer your luck.', pop: '--va-pop', to: 'valley', pl: [836, 784, 'start'], flag: false },
    rn: { name: 'Rainier', ash: 'Shasta · Sourcebook · Seeds', mean: 'Knowledge that feeds every other mountain.', pop: '--rn-pop', to: 'rainier', pl: [864, 200, 'middle'],
      path: 'M790 804C820 790 850 770 862 744L884 680 852 620 880 540 860 470 864 408' },
    ar: { name: 'Ararat', ash: 'Sierra', mean: 'Value exchange. Everything I know, turned into value.', pop: '--ar-pop', to: 'ararat', pl: [1080, 200, 'middle'],
      path: 'M790 804C880 800 980 790 1010 744L1040 680 1020 610 1060 520 1064 450 1080 386' },
    fj: { name: 'Fuji', ash: 'Marvin', mean: 'Love. Feeling people, beyond understanding them.', pop: '--fj-pop', to: 'fuji', pl: [1440, 256, 'end'],
      path: 'M790 804C930 812 1120 800 1220 760L1250 700 1272 620 1288 520 1298 440' },
    ev: { name: 'Everest', ash: 'Summit ahead · empty flag', mean: 'The first company to $10M. Not climbed yet.', pop: '--ev-pop', to: 'everest', pl: [1420, 76, 'end'], flag: false,
      path: 'M790 804C980 822 1230 810 1352 742L1384 640 1366 590 1402 520 1392 470 1426 400 1440 300 1450 222' },
    om: { name: 'Olympus Mons', ash: 'Summit ahead · on Mars', mean: 'The first billion-dollar company. On another planet.', pop: '--om-pop', to: 'olympus-mons', pl: [1200, 262, 'middle'], flag: false,
      path: 'M790 804C900 600 1050 280 1186 170' }
  };

  /* stars for the night sky; ink grass on the plain; a tent at each mountain's foot */
  const R = rng(5); let st = '';
  for (let i = 0; i < 120; i++) st += `<circle cx="${f1(R() * 1600)}" cy="${f1(R() * 460)}" r="${f1(.5 + R() * 1.1)}" style="fill:#F3E9D2;opacity:${f1(.35 + R() * .6)}"/>`;
  $('.hr-stars', svg).innerHTML = st;
  let gr = '';
  for (let i = 0; i < 90; i++) { const x = R() * 1600, y = 760 + R() * 130; if (Math.abs(x - 790) < 160 && y < 870) continue; gr += `<path d="M${f1(x)} ${f1(y)}l-2.4-6M${f1(x)} ${f1(y)}l.6-7M${f1(x)} ${f1(y)}l3-5"/>`; }
  $('.hr-grass', svg).innerHTML = gr;
  const tent = (x, y, c) => `<path d="M${x - 7} ${y}l7-12 7 12z" style="fill:var(--h-plain);stroke:var(--h-ink);stroke-width:1;stroke-linejoin:round"/><path d="M${x} ${y}l-2.4-5.4h4.8z" style="fill:var(${c})"/>`;
  $('.hr-tents', svg).innerHTML = [[318, 756, '--mk-pop'], [530, 758, '--my-pop'], [700, 754, '--kz-pop'], [940, 756, '--rn-pop'], [1120, 752, '--ar-pop'], [1236, 756, '--fj-pop'], [1366, 754, '--ev-pop']].map(a => tent(...a)).join('');

  /* point at a mountain: everything answers at once; click, Enter or a second tap walks there */
  const touchy = !matchMedia('(hover:hover)').matches;
  let cur = null, touchArm = null, lastPtr = 'mouse', w = null;
  const el = (tag, attrs, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };
  function show(k) {
    const d = M[k]; if (!d || cur === k) return;
    cur = k;
    $$('.hm', svg).forEach(g => g.classList.toggle('on', g.dataset.m === k));
    scene.classList.add('focus');
    route.setAttribute('d', d.path || ''); route.style.stroke = `var(${d.pop})`;
    if (w) w.cancel();
    plate.innerHTML = '';
    const [x, y, an] = d.pl, built = !!document.getElementById(d.to);
    plate.appendChild(el('text', { class: 'pl-n', x, y, 'text-anchor': an }, d.name));
    const a = el('text', { class: 'pl-a', x, y: y + 27, 'text-anchor': an, style: `fill:var(${d.pop})` }, d.ash.toUpperCase());
    plate.appendChild(a);
    if (d.flag !== false) { const b = a.getBBox(); plate.appendChild(el('path', { d: `M${f1(b.x - 16)} ${f1(y + 29)}V${f1(y + 13)}l11 4-11 4`, style: `fill:var(${d.pop});stroke:var(--h-ink);stroke-width:1.2;stroke-linejoin:round` })); }
    const g = el('g', { class: 'ins' }); plate.appendChild(g);
    w = Range.write(g, { x, y: y + 57, anchor: an, lines: [['q', d.mean]] }, { delay: 0 });
    plate.appendChild(el('text', { class: 'pl-g', x, y: y + 82, 'text-anchor': an }, built ? (touchy ? 'TAP AGAIN TO WALK THERE' : 'CLICK TO WALK THERE') : 'DRAWN IN THE NEXT PASS'));
  }
  function hide() { cur = null; touchArm = null; if (w) w.cancel(); plate.innerHTML = ''; route.setAttribute('d', ''); scene.classList.remove('focus'); $$('.hm', svg).forEach(g => g.classList.remove('on')); }
  function go(k) { const d = M[k], t = d && document.getElementById(d.to); if (!t) return; const i = $$('main > section').indexOf(t); if (window.CPS && i >= 0) CPS.go(i); else t.scrollIntoView({ behavior: 'smooth' }); }
  $$('.hm', svg).forEach(g => {
    const k = g.dataset.m;
    g.setAttribute('tabindex', '0'); g.setAttribute('role', 'link');
    g.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') show(k); });
    g.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
    g.addEventListener('focus', () => show(k));
    g.addEventListener('blur', hide);
    g.addEventListener('pointerdown', e => { lastPtr = e.pointerType; });
    g.addEventListener('click', e => {
      e.stopPropagation();
      if (lastPtr === 'touch' || lastPtr === 'pen') { if (touchArm === k) { go(k); return; } show(k); touchArm = k; return; }
      go(k);
    });
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(k); } });
  });
  scene.addEventListener('click', () => hide());

  /* the lamp count sits in the head, like every panel's */
  const rt = document.createElement('div'); rt.className = 'route'; rt.innerHTML = '<span class="rt-lamps" style="margin-left:0"></span>';
  $('.pn-head', sec).appendChild(rt);
  Range.initLamps(sec, $('.rt-lamps', rt));

  /* draw-on */
  const lines = [...$$('.hr-rivers path', svg), ...$$('.hr-trails path', svg)];
  prepDraw(lines);
  const start = () => { sec.classList.add('go'); penDraw($$('.hr-rivers path', svg), { delay: 1.5, parallel: true, speed: 700 }); penDraw($$('.hr-trails path', svg), { delay: 1.7, parallel: true, speed: 800 }); setTimeout(() => sec.classList.add('ready'), 3600); };
  if (FINAL) sec.classList.add('go', 'ready'); else requestAnimationFrame(start);
})();

<script>
(() => {
  const sec = $('#mauna-kea'), svg = $('svg.art', sec);
  const R = rng(23);
  /* still stars */
  let s = '';
  for (let i = 0; i < 170; i++) { const x = R() * 1600, y = R() * 430; s += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(.4 + R() * 1.1)}" style="fill:#F3E9D2;opacity:${f1(.25 + R() * .6)}"/>`; }
  $('.mk-starfield', svg).innerHTML = s;
  /* long-exposure star trails around the pole, a full circle so the slow turn never shows a gap */
  let t = '';
  for (let r = 110; r <= 760; r += 11 + R() * 8) {
    for (let n = 0; n < 3; n++) {
      const a0 = R() * 360, span = 8 + R() * 26, a1 = a0 + span, P = a => [1010 + r * Math.cos(a * Math.PI / 180), -60 + r * Math.sin(a * Math.PI / 180)];
      const [x0, y0] = P(a0), [x1, y1] = P(a1);
      t += `<path d="M${f1(x0)} ${f1(y0)}A${f1(r)} ${f1(r)} 0 0 1 ${f1(x1)} ${f1(y1)}" style="stroke-width:${f1(.6 + R() * .8)};opacity:${f1(.18 + R() * .42)}"/>`;
    }
  }
  $('.mk-trails', svg).innerHTML = t;
  /* the scenario fan: ten to fifteen paths from one point */
  let fz = '';
  for (let i = 0; i < 13; i++) {
    const a = (-48 + i * 9) * Math.PI / 180, L = 120 + R() * 50, ex = 1330 + L * Math.cos(a), ey = 250 + L * Math.sin(a), bend = (R() - .5) * 40;
    fz += `<path d="M1330 250Q${f1(1330 + L * .5 * Math.cos(a) - bend * Math.sin(a))} ${f1(250 + L * .5 * Math.sin(a) + bend * Math.cos(a))} ${f1(ex)} ${f1(ey)}" style="opacity:${f1(.35 + R() * .5)}"/><circle cx="${f1(ex)}" cy="${f1(ey)}" r="1.6" style="fill:#F3E9D2;stroke:none"/>`;
  }
  $('.mk-fan', svg).innerHTML = fz + '<circle cx="1330" cy="250" r="4" style="fill:#F2A541;stroke:none"/>';
  /* the sea of clouds: three layers of soft billows */
  const layer = (y, rmin, rmax, fill, op, step, seed) => { const q = rng(seed); let o = `<g style="fill:${fill};opacity:${op}"><rect x="-40" y="${y}" width="1680" height="${530 - y}"/>`;
    for (let x = -40; x < 1660; x += step) o += `<circle cx="${f1(x + q() * 12)}" cy="${f1(y + q() * 10)}" r="${f1(rmin + q() * (rmax - rmin))}"/>`; return o + '</g>'; };
  $('.mk-clouds', svg).innerHTML = layer(452, 22, 36, '#8C80A3', .92, 30, 3) + layer(472, 20, 32, '#B9B0C8', 1, 28, 8) + layer(494, 16, 26, '#D6CCE0', .9, 24, 12);

  /* ===== Under the sea ===== */
  const W = rng(31);
  /* pillow lava on the mountain's flank, fainter with depth */
  let wl = '';
  for (let y = 640; y < 1640; y += 24 + W() * 8) {
    const o = f1(.09 - (y - 640) / 1000 * .05);
    for (let x = -20 + W() * 40; x < 1620; x += 64 + W() * 30) wl += `<ellipse cx="${f1(x)}" cy="${f1(y + W() * 6)}" rx="${f1(22 + W() * 14)}" ry="${f1(8 + W() * 5)}" style="opacity:${o}"/>`;
  }
  $('.mk-wall', svg).innerHTML = wl;
  /* sunlight on the shallows */
  let cs = '';
  for (let i = 0; i < 9; i++) { const y = 616 + i * 14 + W() * 6; let d = `M${f1(-20 + W() * 200)} ${f1(y)}`; for (let x = 200; x < 1640; x += 120) d += `Q${f1(x - 60)} ${f1(y + (W() - .5) * 16)} ${f1(x + W() * 40)} ${f1(y + (W() - .5) * 8)}`; cs += `<path d="${d}" style="opacity:${f1(.16 - i * .016)}"/>`; }
  $('.mk-caustic', svg).innerHTML = cs;
  /* 1. the school: one arrow of fish */
  const fish = 'M10 0c-3-4-10-5-15-1l-5-4v10l5-4c5 4 12 3 15-1z';
  let sc = '';
  for (let i = 0; i < 38; i++) { const u = W(), spread = (1 - u) * 64 + 6, x = 690 + u * 210 + (W() - .5) * 14, y = 800 + (W() * 2 - 1) * spread * (.4 + .6 * W());
    sc += `<path d="${fish}" transform="translate(${f1(x)} ${f1(y)}) scale(${f1(.8 + W() * .5)})" style="opacity:${f1(.7 + W() * .3)}"/>`; }
  $('.mk-school', svg).innerHTML = sc;
  /* 2. the nautilus, in cross-section: a chamber at a time */
  (() => {
    const cx = 800, cy = 1066, Rm = 66, b = Math.log(3) / (2 * Math.PI), TM = 4 * Math.PI + 1.3, a = Rm / Math.exp(b * TM), rot = Math.PI / 2 - TM;
    const P = (th, k = 1) => { const r = a * Math.exp(b * th) * k; return [cx + r * Math.cos(th + rot), cy + r * Math.sin(th + rot)]; };
    const pts = (t0, t1, n = 80, k = 1) => Array.from({ length: n + 1 }, (_, i) => P(t0 + (t1 - t0) * i / n, k));
    const D = arr => arr.map((p, i) => (i ? 'L' : 'M') + f1(p[0]) + ' ' + f1(p[1])).join('');
    let o = `<path d="${D(pts(TM - 2 * Math.PI, TM))}Z" style="fill:#EFE3CC;stroke:#6E5338;stroke-width:1.6"/>`;
    o += `<path d="${D(pts(.6, TM - 2 * Math.PI, 120))}" style="fill:none;stroke:#9E8668;stroke-width:1.4"/>`;
    for (let th = TM - 2 * Math.PI + .3; th < TM - .7; th += .46) { const [x0, y0] = P(th - 2 * Math.PI), [x1, y1] = P(th), [qx, qy] = P(th - .28, .78);
      o += `<path d="M${f1(x0)} ${f1(y0)}Q${f1(qx)} ${f1(qy)} ${f1(x1)} ${f1(y1)}" style="fill:none;stroke:#9E8668;stroke-width:1.3"/>`; }
    for (let th = 1.8; th < TM - 2 * Math.PI; th += .5) { const [x0, y0] = P(th - 2 * Math.PI), [x1, y1] = P(th); o += `<path d="M${f1(x0)} ${f1(y0)}L${f1(x1)} ${f1(y1)}" style="stroke:#B8A488;stroke-width:1"/>`; }
    /* stripes on the outer shell */
    for (let th = TM - 2 * Math.PI + .1; th < TM - .3; th += .3) { const [x0, y0] = P(th, .97), [x1, y1] = P(th - .08, .86); o += `<path d="M${f1(x0)} ${f1(y0)}L${f1(x1)} ${f1(y1)}" style="stroke:#B4643C;stroke-width:3;stroke-linecap:round;opacity:.85"/>`; }
    /* the animal, home in the newest chamber */
    const body = [...pts(TM - .62, TM, 20), ...pts(TM - 2 * Math.PI, TM - 2 * Math.PI - .62, 20)];
    o += `<path d="${D(body)}Z" style="fill:#C9734A"/>`;
    const [ax, ay] = P(TM), [bx, by] = P(TM - 2 * Math.PI);
    for (let i = 0; i < 11; i++) { const k = i / 10, x = ax + (bx - ax) * k, y = ay + (by - ay) * k, L = 18 + W() * 16, c = (W() - .5) * 12;
      o += `<path d="M${f1(x)} ${f1(y)}q${f1(-L / 2)} ${f1(c)} ${f1(-L)} ${f1(c * .4 + 4)}" style="fill:none;stroke:#C9734A;stroke-width:2;stroke-linecap:round"/>`; }
    o += `<circle cx="${f1(ax + (bx - ax) * .35 + 6)}" cy="${f1(ay + (by - ay) * .35 - 6)}" r="3.4" style="fill:#1A1420"/>`;
    $('.mk-naut', svg).innerHTML = o;
  })();
  /* 3. the anemone on the crab's shell */
  let an = '';
  for (let i = 0; i < 11; i++) { const a = (-160 + i * 14) * Math.PI / 180, L = 16 + W() * 10; an += `<path d="M860 1172q${f1(Math.cos(a) * L * .5 + 4)} ${f1(Math.sin(a) * L * .5)} ${f1(Math.cos(a) * L)} ${f1(Math.sin(a) * L)}" style="opacity:${f1(.7 + W() * .3)}"/>`; }
  $('.mk-anem', svg).innerHTML = an;

  /* ===== Stops, in story order ===== */
  const fanPaths = $$('.mk-fan path', svg), chainLine = $$('.mk-chain-line', svg), smoke = $('.mk-smoke', svg), dbeam = $('.mk-dbeam', svg);
  const redraw = (ps, o) => { prepDraw(ps); penDraw(ps, o); };
  const stops = [
    { id: 'tuition', label: 'AGE 12', name: 'Camp at age 12', at: [1338, 548], hit: [1300, 556, 30], spot: [1250, 470, 260, 150],
      act: on => { if (on && !FINAL) redraw([smoke], { speed: 200, max: .9 }); return 420; },
      ins: { x: 1280, y: 370, anchor: 'end', lines: [['k', 'CAMP · AGE 12'], ['t', 'A tuition room.'], ['q', '“Why do we fight?”'], ['t', 'The day everything changed.']] } },
    { id: 'chain', label: 'THE CHAIN', name: 'Stars: the constellation', at: [930, 232], hit: [846, 180, 70], spot: [960, 150, 330, 140],
      act: on => { if (on && !FINAL) redraw(chainLine, { speed: 420 }); return 520; },
      ins: { x: 1030, y: 70, lines: [['k', 'STARS · THE CHAIN'], ['q', '“Awareness is the thing'], ['q', 'that gives you a choice.'], ['q', 'Without it, you\'re at the mercy'], ['q', 'of whatever happens.”']] } },
    { id: 'dome', label: 'DOMES', name: 'The observatories', at: [948, 296], hit: [930, 322, 40], spot: [1030, 290, 300, 110],
      act: on => { if (on && !FINAL) redraw([dbeam], { speed: 700, min: .3, max: .45 }); return 420; },
      ins: { x: 1166, y: 192, lines: [['k', 'THE OBSERVATORIES'], ['q', '“What am I doing?'], ['q', 'What\'s my goal with this?”'], ['t', 'Asked every moment.']] } },
    { id: 'pueo', label: 'PUEO', name: 'Cairn by the pueo', at: [772, 318], hit: [748, 352, 20], spot: [800, 400, 260, 120],
      act: () => 820,
      ins: { x: 790, y: 410, lines: [['k', 'CAIRN · A PRINCIPLE'], ['q', '“We never know the problems.'], ['q', 'We only know the symptoms.”'], ['t', 'The pueo reads tracks in the snow.']] } },
    { id: 'fan', label: 'RAPIDO', name: 'Star trails: scenarios in parallel', at: [1262, 326], hit: [1390, 230, 70], spot: [1250, 200, 300, 150],
      act: on => { if (on && !FINAL) redraw(fanPaths, { speed: 2600, min: .06, max: .14, overlap: 1 }); return 260; },
      ins: { x: 1300, y: 120, anchor: 'end', lines: [['k', 'STAR TRAILS · SCENARIOS IN PARALLEL'], ['t', 'One near-fall on a Rapido.'], ['t', 'Ten to fifteen scenarios rehearsed.']] } },
    { id: 'gulmarg', label: 'GULMARG', name: 'Camp: the Gulmarg bus', at: [606, 420], hit: [566, 412, 22], spot: [470, 400, 220, 110],
      ins: { x: 540, y: 340, anchor: 'end', lines: [['k', 'CAMP · GULMARG'], ['t', 'Gulmarg bus.'], ['t', 'Planned how to fall.'], ['t', 'Saved my back.']] } },
    { id: 'cloud', label: 'THE CLOUDS', name: 'The sea of clouds', at: [600, 470], side: 'l', hit: [640, 505, 34], spot: [780, 520, 400, 110],
      ins: { x: 700, y: 490, lines: [['k', 'THE SEA OF CLOUDS'], ['t', 'Numbing hides the signal.'], ['q', '“Uncertainty is one of the hardest'], ['q', 'feelings to sit with.”'], ['t', 'Sit with it, and you see.']] } },
    { id: 'dive', label: 'DIVE', name: 'Dive: the four layers', at: [590, 700], hit: [520, 690, 34], noVeil: true, sticky: true,
      act: on => { if (!FINAL) dive(on ? Math.max(1, depth) : 0); return 0; },
      next: d => { if (d > 0 && depth < 4) { dive(depth + 1); return true; } if (d < 0 && depth > 1) { dive(depth - 1); return true; } return false; } }
  ];

  /* ===== The dive: the camera and the bathysphere go down, stop by stop ===== */
  const LAY = [
    { y: 0, name: 'SURFACE' },
    { y: 330, name: 'GOALS', cone: 0, ins: [['k', 'GOALS · THE SUNLIGHT ZONE'], ['q', '“Your best approximation of the'], ['q', 'values you\'re trying to live by.”'], ['t', 'The school turns when the light finds it.']] },
    { y: 600, name: 'IDENTITY', cone: 0, ins: [['k', 'IDENTITY · THE TWILIGHT ZONE'], ['q', '“I\'m a university student.'], ['q', 'I\'m a lifelong learner.”'], ['t', 'A nautilus lives in the newest'], ['t', 'chamber it built.']] },
    { y: 760, name: 'ACQUIRED VALUES', cone: 0, ins: [['k', 'ACQUIRED VALUES · THE MIDNIGHT ZONE'], ['q', '“Respect, humility.'], ['q', 'Picked up from the world.”'], ['t', 'A hermit crab wears a shell it found.']] },
    { y: 900, name: 'NATURAL VALUES', cone: 24, ins: [['k', 'NATURAL VALUES · UNDER THE FLOOR'], ['q', '“For me, it\'s curiosity.'], ['q', 'You can\'t take that out of me.”'], ['t', 'Hawaii sits on a hotspot. The heat'], ['t', 'below built the whole mountain.']] }
  ];
  const sph = $('.mk-sph', svg), cable = $('.mk-cable', svg), gauge = $('.mk-gauge', svg), gm = $('.mk-gm', svg), cone = $('.mk-cone', svg), dw = $('.mk-dw', svg);
  const sphY = y => y <= 330 ? 690 + y / 330 * 110 : y + 470;
  const GT = [702, 744, 786, 828, 870];
  gauge.insertAdjacentHTML('beforeend', LAY.map((L, k) => `<g class="mk-gt" data-d="${k}" tabindex="0" role="button" aria-label="${k ? 'Dive to ' + L.name.toLowerCase() : 'Back to the surface'}">
    <rect class="gt-hit" x="160" y="${GT[k] - 18}" width="210" height="30"/><path d="M168 ${GT[k] - 4}h8" style="stroke:var(--mk-cream);stroke-width:1.2"/>
    <text x="186" y="${GT[k]}">${L.name}</text></g>`).join(''));
  let depth = 0, camY = 0, raf = 0, words = null, P;
  function cam(y) {
    camY = y;
    if (!FINAL) svg.setAttribute('viewBox', `0 ${f1(y)} 1600 900`);
    const sy = sphY(y);
    sph.setAttribute('transform', `translate(0 ${f1(sy)})`); cable.setAttribute('d', `M520 561V${f1(sy - 34)}`);
    gauge.setAttribute('transform', `translate(0 ${f1(y)})`);
  }
  function dive(k) {
    k = Math.max(0, Math.min(4, k));
    const from = camY, to = LAY[k].y, L = LAY[k];
    depth = k; sec.classList.toggle('deep', k > 0);
    sec.classList.remove('beam', 'z1', 'z2', 'z3', 'z4');
    if (words) words.cancel(); dw.innerHTML = '';
    gm.setAttribute('transform', `translate(0 ${GT[k] - 4})`);
    $$('.mk-gt', gauge).forEach(g => g.classList.toggle('on', +g.dataset.d === k));
    queueMicrotask(() => { const l = $('.rt-l', sec); if (l && k) l.textContent = 'DIVE · ' + L.name; });
    cancelAnimationFrame(raf);
    const arrive = () => {
      if (!k) return;
      cone.setAttribute('transform', `rotate(${L.cone} 552 0)`);
      sec.classList.add('beam', 'z' + k);
      words = Range.write(dw, { x: 960, y: sphY(to) - 52, lines: L.ins }, { delay: 380 });
    };
    if (FINAL || from === to) { cam(to); arrive(); return; }
    const t0 = performance.now(), dur = Math.min(1500, 650 + Math.abs(to - from) * 1.2);
    const ease = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    const tick = now => { const u = Math.min(1, (now - t0) / dur); cam(from + (to - from) * ease(u)); if (u < 1) raf = requestAnimationFrame(tick); else arrive(); };
    raf = requestAnimationFrame(tick);
  }
  $$('.mk-gt', gauge).forEach(g => {
    const go = e => { e.stopPropagation(); if (FINAL) return; const k = +g.dataset.d; if (!k) { Range.close(P); return; } if (P.open !== 7) Range.open(P, 7); dive(k); };
    g.addEventListener('click', go);
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(e); } });
  });

  P = Range.initPanel(sec, stops);
  /* the small dome's slit glows while its lamp is lit */
  const syncSlit = () => sec.classList.toggle('slit-on', NIGHT && !!$('.lamp[data-lamp="slit"].on', sec));
  sec.addEventListener('click', () => requestAnimationFrame(syncSlit)); document.addEventListener('range:night', syncSlit); syncSlit();

  if (FINAL) {   /* everything at once: the full height, every creature lit, every layer written */
    svg.setAttribute('viewBox', '0 0 1600 1800');
    sec.classList.add('z1', 'z2', 'z3', 'z4', 'final-all');
    [1, 2, 3, 4].forEach(k => { const g = document.createElementNS(NS, 'g'); g.setAttribute('class', 'ins'); dw.appendChild(g); Range.write(g, { x: 960, y: sphY(LAY[k].y) - 52, lines: LAY[k].ins }, { now: true }); });
  } else cam(0);

  /* arrival: trails expose, the chain draws, the owl looks */
  const arcs = $$('.mk-trails path', svg);
  prepDraw([...arcs, ...fanPaths, ...chainLine]);
  onView(sec, () => {
    penDraw(arcs, { parallel: true, speed: 300, max: 2.2 });
    penDraw(chainLine, { delay: .5, speed: 400 });
    penDraw(fanPaths, { delay: .9, parallel: true, speed: 260 });
    sec.classList.add('arrived');
  }, .35);
  /* the one loop (the slow turn of the sky) sleeps off screen */
  if (!FINAL && 'IntersectionObserver' in window) new IntersectionObserver(es => es.forEach(e => sec.classList.toggle('live', e.isIntersecting)), { threshold: .05 }).observe(sec);
})();
